<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2420; --ink-soft:#8A7458; --paper:#FFFCF5; --paper-warm:#FBF1DD; --line:#E9D9B8;
    --accent:#C79A4B; --accent2:#C98A94;
    --hero-top:#FFF6E0; --hero-mid:#FCE9C4; --hero-bottom:#F1D6A0; --hero-text:#3A2A18;
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  }
  body[data-theme="homecoming"]{
    --accent:#2A3D63; --accent2:#7A2233;
    --hero-top:#050810; --hero-mid:#0F1930; --hero-bottom:#1B2740; --hero-text:#F3E9CE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:linear-gradient(180deg, var(--hero-top), var(--hero-mid) 55%, var(--hero-bottom));
    font-family:var(--font-body); color:var(--ink);
  }
  .card{
    max-width:420px; width:100%; background:color-mix(in srgb, var(--paper) 96%, transparent);
    border:1px solid var(--line); border-radius:20px; padding:40px 34px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.35);
    animation:fadeInUp .6s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  .eyebrow{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 6px; text-align:center;}
  h1{font-family:var(--font-display); font-weight:600; font-size:1.7rem; text-align:center; margin:0 0 6px; color:var(--ink);}
  .sub{text-align:center; color:var(--ink-soft); font-size:.88rem; margin:0 0 28px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select{
    width:100%; font-family:var(--font-body); font-size:.95rem; padding:11px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--paper-warm); color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
  .rsvp-choice{display:flex; gap:10px;}
  .rsvp-choice button{
    flex:1; padding:12px; border:1.5px solid var(--line); background:var(--paper-warm); border-radius:10px;
    font-family:var(--font-body); font-weight:600; font-size:.88rem; cursor:pointer; color:var(--ink-soft);
    transition:all .25s ease;
  }
  .rsvp-choice button.active[data-v="yes"]{background:#DFEEDD; border-color:#2E6B3E; color:#2E6B3E;}
  .rsvp-choice button.active[data-v="no"]{background:#F0E1E3; border-color:#8C3B47; color:#8C3B47;}
  .checkrow{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .checkrow label{font-size:.88rem; color:var(--ink);}
  button.submit{
    width:100%; background:linear-gradient(120deg, var(--accent), var(--accent2)); color:#fff;
    border:none; padding:13px; border-radius:10px; font-weight:600; font-size:.95rem; cursor:pointer;
    font-family:var(--font-body); margin-top:6px;
  }
  button.submit:disabled{opacity:.6; cursor:default;}
  .thanks{text-align:center; display:none;}
  .thanks.show{display:block;}
  .thanks svg{width:44px; height:44px; color:var(--accent); margin-bottom:14px;}
  .thanks h1{margin-bottom:10px;}
  #form.hide{display:none;}
  .error{color:#B23B2E; font-size:.82rem; text-align:center; min-height:18px; margin-top:4px;}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow" id="eyebrow">You're invited to the</p>
    <h1 id="title">Wedding</h1>
    <p class="sub" id="sub">We'd love to know if you can make it.</p>

    <form id="form">
      <div class="field"><label>Your name</label><input id="name" required></div>
      <div class="field"><label>Which side?</label>
        <select id="side">
          <option value="">Prefer not to say</option>
          <option>His side</option><option>Her side</option><option>Family</option><option>Friends</option><option>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Will you be attending?</label>
        <div class="rsvp-choice">
          <button type="button" data-v="yes">Joyfully accept</button>
          <button type="button" data-v="no">Regretfully decline</button>
        </div>
      </div>
      <div class="checkrow">
        <input type="checkbox" id="plusOne">
        <label for="plusOne">I'll be bringing a plus one</label>
      </div>
      <div class="field"><label>Dietary requirements / notes</label><input id="notes" placeholder="Optional"></div>
      <button class="submit" type="submit" id="submitBtn">Send RSVP</button>
      <p class="error" id="err"></p>
    </form>

    <div class="thanks" id="thanks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21c0-5-4-6-4-10a4 4 0 0 1 8 0c0 4-4 5-4 10Z"/></svg>
      <h1>Thank you!</h1>
      <p class="sub">Your RSVP has been received.</p>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const params = new URLSearchParams(window.location.search);
const eventId = params.get('event') === 'homecoming' ? 'homecoming' : 'wedding';
document.body.dataset.theme = eventId;

const COPY = {
  wedding: { title:'Wedding', eyebrow:"You're invited to the", sub:"We'd love to know if you can make it." },
  homecoming: { title:'Homecoming', eyebrow:"You're invited to the", sub:"A night to remember — let us know if you'll be there." }
};
document.getElementById('title').textContent = COPY[eventId].title;
document.getElementById('eyebrow').textContent = COPY[eventId].eyebrow;
document.getElementById('sub').textContent = COPY[eventId].sub;

let rsvpValue = null;
document.querySelectorAll('.rsvp-choice button').forEach(btn => {
  btn.addEventListener('click', () => {
    rsvpValue = btn.dataset.v;
    document.querySelectorAll('.rsvp-choice button').forEach(b => b.classList.toggle('active', b === btn));
  });
});

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  const name = document.getElementById('name').value.trim();
  if (!name){ errEl.textContent = 'Please enter your name.'; return; }
  if (!rsvpValue){ errEl.textContent = 'Please let us know if you can make it.'; return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Sending…';

  const { error } = await supabaseClient.from('guests').insert([{
    event_id: eventId,
    name,
    side: document.getElementById('side').value || null,
    rsvp_status: rsvpValue,
    plus_one: document.getElementById('plusOne').checked,
    dietary_notes: document.getElementById('notes').value || null
  }]);

  if (error){
    errEl.textContent = "Something went wrong — please try again.";
    btn.disabled = false; btn.textContent = 'Send RSVP';
    return;
  }

  document.getElementById('form').classList.add('hide');
  document.getElementById('thanks').classList.add('show');
});
</script>
</body>
</html>
