<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wedding &amp; Homecoming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* shared, theme-stable */
    --ink:#2B2420;
    --ink-soft:#8A7458;
    --paper:#FFFCF5;
    --paper-warm:#FBF1DD;
    --line:#E9D9B8;
    --danger:#B23B2E;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-snap:cubic-bezier(.34,1.56,.64,1);
    --portal-ease:cubic-bezier(.65,0,.35,1);

    /* wedding — ivory, gold, rose gold, lantern-festival mood */
    --accent:#E0AC4C;
    --accent-deep:#B4842E;
    --accent2:#C98A94;
    --accent2-light:#F8E6E4;
    --hero-top:#3D2530;
    --hero-mid:#A66B76;
    --hero-bottom:#E8A855;
    --hero-text:#F8EEDE;
    --hero-text-soft:#E3C6C4;
  }
  body[data-theme="homecoming"]{
    /* homecoming — ivory, deep red, navy (red leads, navy recedes) */
    --accent:#8B1A2B;
    --accent-deep:#4A0D16;
    --accent2:#2A3D63;
    --accent2-light:#E2E6EE;
    --hero-top:#0A0E1C;
    --hero-mid:#2E0A11;
    --hero-bottom:#6B1622;
    --hero-text:#F5EAE0;
    --hero-text-soft:#D9AEAE;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  ::selection{background:var(--accent); color:var(--paper);}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    transition:background 1s var(--ease);
  }

  @keyframes fadeInUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  @keyframes floatBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  @keyframes twinkle{ 0%,100%{opacity:.2; transform:scale(.7);} 50%{opacity:1; transform:scale(1.2);} }
  @keyframes shimmerSweep{ 0%{background-position:-150% 0;} 100%{background-position:250% 0;} }
  @keyframes lanternRise{
    0%{transform:translateY(0) translateX(0) rotate(0);}
    100%{transform:translateY(-140vh) translateX(var(--drift,30px)) rotate(3deg);}
  }
  @keyframes petalFall{
    0%{transform:translateY(-10vh) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:.9;}
    90%{opacity:.85;}
    100%{transform:translateY(115vh) translateX(var(--drift,40px)) rotate(340deg); opacity:0;}
  }
  @keyframes spinSlow{ to{transform:rotate(360deg);} }
  @keyframes spinSlowRev{ to{transform:rotate(-360deg);} }
  @keyframes shootingStar{
    0%{transform:translate(0,0) rotate(-18deg); opacity:0; width:0;}
    4%{opacity:1; width:90px;}
    16%{opacity:0; width:0;}
    100%{opacity:0;}
  }
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 45%, transparent));}
    50%{filter:drop-shadow(0 0 26px color-mix(in srgb, var(--accent) 70%, transparent));}
  }
  @keyframes shake{ 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} 100%{transform:translateX(0);} }

  .garland{position:absolute; top:6px; left:50%; transform:translateX(-50%); width:min(560px,86vw); opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="wedding"] .garland{opacity:.9;}
  .roseVine{position:absolute; top:6px; left:50%; transform:translateX(-50%); width:min(500px,84vw); opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="homecoming"] .roseVine{opacity:.85;}

  .stampGlyph{width:16px; height:16px; margin-bottom:2px; opacity:.85;}

  #achievementModal{
    position:fixed; inset:0; z-index:95; display:flex; align-items:center; justify-content:center;
    background:rgba(10,8,6,.4); opacity:0; pointer-events:none; transition:opacity .4s var(--ease);
    perspective:1200px; padding:20px;
  }
  #achievementModal.show{opacity:1; pointer-events:auto;}
  .ach-card{
    background:linear-gradient(160deg, var(--paper), var(--paper-warm));
    border:1px solid var(--line); border-radius:20px; padding:40px 46px; max-width:360px; text-align:center;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.55);
    transform:rotateY(-95deg); transform-origin:left center;
    transition:transform .65s var(--ease-snap); cursor:pointer;
  }
  #achievementModal.show .ach-card{transform:rotateY(0deg);}
  .ach-card .ach-icon{width:42px; height:42px; margin:0 auto 14px; color:var(--accent);}
  .ach-title{font-family:var(--font-display); font-size:1.4rem; font-weight:600; color:var(--ink); margin:0 0 8px;}
  .ach-msg{font-size:.88rem; color:var(--ink-soft); margin:0;}

  /* ================= HERO WORLD ================= */
  .hero{
    position:relative; min-height:82vh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:132px 20px 64px;
    background:linear-gradient(180deg, var(--hero-top) 0%, var(--hero-mid) 48%, var(--hero-bottom) 100%);
    transition:background 1s var(--ease);
  }
  .hero-layer{position:absolute; inset:0; overflow:hidden; pointer-events:none;}

  /* -- sun (wedding) -- */
  .sunGlow{
    position:absolute; top:-14%; right:-6%; width:52vw; height:52vw; max-width:640px; max-height:640px;
    border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 70%);
    filter:blur(6px);
    opacity:0; transition:opacity 1s var(--ease);
  }
  .sunRays{
    position:absolute; top:-10%; right:-4%; width:44vw; height:44vw; max-width:560px; max-height:560px;
    opacity:0; transition:opacity 1s var(--ease); animation:spinSlow 90s linear infinite;
  }
  body[data-theme="wedding"] .sunGlow, body[data-theme="wedding"] .sunRays{opacity:1;}

  /* -- moon + rose window (homecoming) -- */
  .roseWindow{
    position:absolute; top:4%; right:2%; width:46vw; height:46vw; max-width:520px; max-height:520px;
    opacity:0; transition:opacity 1.2s var(--ease); animation:spinSlowRev 140s linear infinite;
  }
  body[data-theme="homecoming"] .roseWindow{opacity:.85;}

  /* -- stars (homecoming) -- */
  .stars{position:absolute; inset:0; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="homecoming"] .stars{opacity:1;}
  .star{position:absolute; background:var(--hero-text); border-radius:50%; animation:twinkle 3s ease-in-out infinite;}
  .shootStar{
    position:absolute; height:1.5px; width:0; background:linear-gradient(90deg, transparent, #fff, transparent);
    transform-origin:left center; animation:shootingStar 6s ease-in infinite;
  }

  /* -- lanterns (wedding) -- */
  .lanterns{position:absolute; inset:0; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="wedding"] .lanterns{opacity:1;}
  .lantern{
    position:absolute; bottom:-80px; width:22px; height:30px;
    border-radius:48% 48% 44% 44% / 58% 58% 42% 42%;
    background:radial-gradient(circle at 50% 35%, #FFF3D2, var(--accent) 62%, var(--accent-deep) 100%);
    box-shadow:0 0 18px 6px color-mix(in srgb, var(--accent) 55%, transparent);
    animation:lanternRise linear infinite;
  }
  .lantern::after{content:''; position:absolute; left:50%; top:-7px; width:1px; height:7px; background:var(--accent-deep); transform:translateX(-50%);}

  .towerScene{
    position:absolute; left:-2%; bottom:0; width:min(30vw, 300px); opacity:0;
    transition:opacity 1.2s var(--ease); pointer-events:none;
  }
  body[data-theme="wedding"] .towerScene{opacity:.9;}
  .towerScene .waterfall{ animation:waterfallShimmer 3s ease-in-out infinite; }
  @keyframes waterfallShimmer{ 0%,100%{opacity:.32;} 50%{opacity:.55;} }
  .towerScene .tower-window{ animation:towerGlow 2.6s ease-in-out infinite; }
  @keyframes towerGlow{ 0%,100%{opacity:.65;} 50%{opacity:1;} }

  /* -- petals (homecoming) -- */
  .petals{position:absolute; inset:0; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="homecoming"] .petals{opacity:1;}
  .petal{
    position:absolute; top:-30px; width:11px; height:15px; border-radius:70% 10% 70% 10%;
    background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #000));
    animation:petalFall linear infinite;
  }

  /* -- botanical border (wedding) -- */
  .vineBorder{position:absolute; left:0; right:0; bottom:-2px; height:70px; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="wedding"] .vineBorder{opacity:.55;}

  /* -- candelabra border (homecoming) -- */
  .candleBorder{position:absolute; left:0; right:0; bottom:-2px; height:70px; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="homecoming"] .candleBorder{opacity:.5;}

  .hero-inner{position:relative; z-index:2;}
  .eyebrow{
    font-family:var(--font-mono); font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--hero-text-soft); margin:0 0 14px; transition:color 1s var(--ease);
  }
  .hero h1{
    font-family:var(--font-display); font-weight:600; font-size:clamp(2.6rem, 7vw, 5.2rem);
    margin:0; color:var(--hero-text); letter-spacing:-.01em; line-height:1.02;
    text-shadow:0 2px 40px color-mix(in srgb, var(--accent) 35%, transparent);
    transition:color 1s var(--ease);
  }
  .hero .tagline{
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:clamp(1rem,2.2vw,1.35rem);
    color:var(--hero-text-soft); margin:16px 0 40px; transition:color 1s var(--ease); min-height:1.6em;
  }

  .portals{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-bottom:52px;}
  .portal-btn{
    position:relative; overflow:hidden; cursor:pointer; border:1.5px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    background:color-mix(in srgb, var(--hero-text) 8%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--hero-text); font-family:var(--font-display); font-size:1.05rem; font-weight:500;
    padding:16px 34px; border-radius:100px; display:flex; align-items:center; gap:10px;
    transition:transform .4s var(--ease-snap), background .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease);
  }
  .portal-btn svg{width:18px; height:18px; flex-shrink:0;}
  .portal-btn:hover{transform:translateY(-3px);}
  .portal-btn.active{
    background:linear-gradient(120deg, var(--accent), var(--accent2));
    color:#fff; border-color:transparent;
    box-shadow:0 14px 30px -12px color-mix(in srgb, var(--accent) 70%, transparent);
    transform:translateY(-2px) scale(1.04);
  }

  .heroStamp{
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
    width:128px; height:128px; border-radius:50%;
    border:1.5px dashed color-mix(in srgb, var(--hero-text) 55%, transparent);
    background:color-mix(in srgb, var(--hero-text) 6%, transparent);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    animation:floatBob 5s ease-in-out infinite, glowPulse 3.2s ease-in-out infinite;
    font-family:var(--font-mono); color:var(--hero-text); margin-bottom:8px;
  }
  .heroStamp .n{font-size:2.1rem; font-weight:600; line-height:1;}
  .heroStamp .n{font-variant-numeric:tabular-nums;}
  .heroStamp .hms{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.03em; margin-top:2px; opacity:.85; font-variant-numeric:tabular-nums;}
  .heroStamp .u{font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; margin-top:4px; opacity:.8;}
  .heroDate{margin-top:10px;}
  .heroDate label{
    display:block; font-family:var(--font-mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--hero-text-soft); margin-bottom:6px;
  }
  .heroDate input{
    font-family:var(--font-body); font-size:.9rem; border:1px solid color-mix(in srgb, var(--hero-text) 35%, transparent);
    background:color-mix(in srgb, var(--hero-text) 8%, transparent); color:var(--hero-text);
    padding:7px 10px; border-radius:8px; text-align:center;
  }
  .heroDate input::-webkit-calendar-picker-indicator{filter:invert(.5);}

  .scrollCue{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    color:var(--hero-text-soft); animation:floatBob 2.4s ease-in-out infinite; opacity:.75;
  }

  /* ================= CONTENT ================= */
  #main-content{max-width:1180px; margin:0 auto; padding:0 24px 90px; position:relative; z-index:1;}

  .stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:16px; margin-top:-56px; margin-bottom:36px; position:relative; z-index:3;}
  .stat-card{
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line); border-radius:16px; padding:18px 20px;
    box-shadow:0 24px 44px -30px rgba(0,0,0,.35);
    transition:transform .35s var(--ease-snap), box-shadow .35s var(--ease);
    animation:fadeInUp .6s var(--ease) both;
  }
  .stat-card:hover{transform:translateY(-4px); box-shadow:0 30px 50px -26px color-mix(in srgb, var(--accent) 45%, transparent);}
  .stat-card .icon{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); margin-bottom:12px;
  }
  .stat-card .icon svg{width:18px; height:18px; stroke:#fff; fill:none;}
  .stat-card .v{font-family:var(--font-mono); font-size:1.3rem; font-weight:600; color:var(--accent);}
  .stat-card .l{font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}

  /* ---------- section nav ---------- */
  .section-tabs{
    display:flex; gap:6px; background:var(--paper-warm); border:1px solid var(--line);
    border-radius:100px; padding:6px; margin-bottom:32px; position:relative; overflow-x:auto;
    width:fit-content; max-width:100%;
  }
  .section-tabs button{
    position:relative; z-index:2; background:transparent; border:none; cursor:pointer;
    padding:11px 22px; font-family:var(--font-body); font-weight:600; font-size:.82rem;
    color:var(--ink-soft); white-space:nowrap; border-radius:100px; display:flex; align-items:center; gap:8px;
    transition:color .35s var(--ease);
  }
  .section-tabs button svg{width:15px; height:15px; stroke:currentColor; fill:none; flex-shrink:0;}
  .section-tabs button.active{color:#fff;}
  #tabIndicator{
    position:absolute; top:6px; bottom:6px; left:6px; border-radius:100px; z-index:1;
    background:linear-gradient(120deg, var(--accent), var(--accent2));
    box-shadow:0 8px 18px -8px color-mix(in srgb, var(--accent) 65%, transparent);
    transition:left .45s var(--ease-snap), width .45s var(--ease-snap), background 1s var(--ease);
  }

  main{padding-top:4px;}

  .rotate-tip{
    display:flex; align-items:center; gap:12px; background:var(--paper-warm); border:1px solid var(--line);
    border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:.82rem; color:var(--ink-soft);
    animation:fadeInUp .4s var(--ease) both;
  }
  .rotate-tip-icon{width:24px; height:24px; flex-shrink:0; color:var(--accent); animation:rotateHint 2.2s ease-in-out infinite;}
  @keyframes rotateHint{
    0%,15%{transform:rotate(0deg);}
    45%,65%{transform:rotate(90deg);}
    88%,100%{transform:rotate(0deg);}
  }
  .rotate-tip span{flex:1; line-height:1.4;}
  .rotate-tip button{
    background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:.9rem; padding:4px 6px;
    border-radius:50%; transition:background .2s ease, color .2s ease; flex-shrink:0;
  }
  .rotate-tip button:hover{background:var(--paper); color:var(--danger);}

  /* ---------- add form ---------- */
  .add-toggle{
    background:var(--ink); color:var(--paper); border:none; border-radius:10px;
    padding:11px 18px; font-family:var(--font-body); font-weight:600; font-size:.82rem;
    cursor:pointer; margin-bottom:18px; transition:transform .3s var(--ease-snap), box-shadow .3s var(--ease);
  }
  .add-toggle:hover{transform:translateY(-2px); box-shadow:0 12px 20px -10px rgba(0,0,0,.4);}
  .add-form{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:14px; background:color-mix(in srgb, var(--paper-warm) 85%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:16px;
    padding:0 20px; margin-bottom:0;
    max-height:0; opacity:0; overflow:hidden; transform:translateY(-8px);
    transition:max-height .5s var(--ease), opacity .35s var(--ease), padding .5s var(--ease), margin .5s var(--ease), transform .5s var(--ease);
  }
  .add-form.open{max-height:560px; opacity:1; padding:20px; margin-bottom:26px; transform:translateY(0);}
  .add-form .full{grid-column:1/-1;}
  .field label{display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; font-family:var(--font-body); font-size:.9rem; padding:9px 10px;
    border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);
    transition:border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .add-form .submit-row{grid-column:1/-1; display:flex; justify-content:flex-end; gap:10px;}
  .btn-primary{
    position:relative; overflow:hidden;
    background:linear-gradient(120deg, var(--accent), var(--accent2));
    color:#fff; border:none; padding:10px 22px;
    border-radius:10px; font-weight:600; font-size:.82rem; cursor:pointer; font-family:var(--font-body);
    transition:transform .3s var(--ease-snap), box-shadow .3s var(--ease);
  }
  .btn-primary::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 20%, rgba(255,255,255,.55) 40%, transparent 60%);
    background-size:250% 100%; background-position:-150% 0; opacity:0; transition:opacity .3s ease;
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 14px 24px -12px color-mix(in srgb, var(--accent) 70%, transparent);}
  .btn-primary:hover::after{opacity:1; animation:shimmerSweep 1.4s ease-in-out infinite;}
  .btn-ghost{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line); padding:10px 18px;
    border-radius:10px; font-size:.82rem; cursor:pointer; font-family:var(--font-body);
    transition:border-color .3s var(--ease), color .3s var(--ease);
  }
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}

  /* ---------- data table ---------- */
  .table-wrap{
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line); border-radius:16px; padding:6px 8px;
    box-shadow:0 30px 50px -34px rgba(0,0,0,.3);
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  table.data-table{table-layout:fixed; border-collapse:collapse; font-size:.87rem;}
  .data-table th{
    text-align:left; font-family:var(--font-mono); font-size:.64rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); padding:12px 12px 10px; border-bottom:1px solid var(--line);
  }
  .data-table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .data-table tbody tr:last-child td{border-bottom:none;}
  .data-table tbody tr{animation:fadeInUp .4s var(--ease) both; transition:background .3s var(--ease);}
  .data-table tr:hover td{background:color-mix(in srgb, var(--accent) 6%, transparent);}
  .data-table input, .data-table select, .data-table textarea{
    border:1px solid transparent; background:transparent; font-family:var(--font-body);
    font-size:.85rem; width:100%; padding:6px 7px; border-radius:7px; color:var(--ink);
    transition:border-color .25s var(--ease), background .25s var(--ease);
  }
  .data-table input:hover, .data-table select:hover, .data-table textarea:hover{border-color:var(--line); background:var(--paper);}
  .data-table input:focus, .data-table select:focus, .data-table textarea:focus{
    outline:none; border-color:var(--accent); background:var(--paper); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .data-table input[type="number"]{font-family:var(--font-mono);}
  .data-table select.badge{min-width:132px; padding:6px 10px;}
  .data-table textarea{
    resize:none; overflow:hidden; line-height:1.4; min-height:30px; display:block;
    font-family:var(--font-body); white-space:pre-wrap; overflow-wrap:break-word;
  }
  .data-table td.wrap-col{min-width:165px; max-width:230px;}
  .data-table td.wrap-col textarea{max-width:100%; width:100%;}
  .data-table td.num-col{min-width:118px;}

  .del-btn{
    background:none; border:none; color:var(--danger); cursor:pointer; font-size:1.1rem;
    line-height:1; padding:4px 6px; transition:transform .2s var(--ease-snap), opacity .2s ease; opacity:.55;

  .empty-row td{padding:34px 10px; text-align:center; color:var(--ink-soft); font-style:italic;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:600;}
  .badge.researching{background:#EDEAE1; color:#7A7362;}
  .badge.unpaid{background:#EDEAE1; color:#7A7362;}
  .badge.contacted{background:#E4EAF2; color:#37567F;}
  .badge.booked{background:#E1EBE7; color:#2C4A44;}
  .badge.paid_deposit{background:#F4EAD3; color:#8C6D3F;}
  .badge.paid_full{background:#DFEEDD; color:#2E6B3E;}
  .badge.pending{background:#EDEAE1; color:#7A7362;}
  .badge.yes{background:#DFEEDD; color:#2E6B3E;}
  .badge.no{background:#F0E1E3; color:#8C3B47;}

  .budget-summary{display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
  .budget-summary .stat-card{padding:14px 18px; flex:1; min-width:150px;}

  .mood-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; margin-top:18px;}
  .mood-item{
    position:relative; border-radius:12px; overflow:hidden; aspect-ratio:1; background:var(--paper-warm);
    animation:fadeInUp .4s var(--ease) both; box-shadow:0 14px 26px -18px rgba(0,0,0,.3);
    transition:transform .3s var(--ease-snap);
  }
  .mood-item:hover{transform:scale(1.03) rotate(-.6deg);}
  .mood-item img{width:100%; height:100%; object-fit:cover; display:block;}
  .mood-del{
    position:absolute; top:6px; right:6px; background:rgba(0,0,0,.55); color:#fff; border:none;

  .mood-item.pdf-tile{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:var(--paper-warm); padding:16px; text-align:center; cursor:pointer;
  }
  .mood-item.pdf-tile svg{width:32px; height:32px; color:var(--accent); flex-shrink:0;}
  .mood-item.pdf-tile .pdf-name{
    font-size:.68rem; color:var(--ink-soft); word-break:break-word; line-height:1.35;
    max-height:2.7em; overflow:hidden; font-family:var(--font-body);
  }
  .pdf-badge{
    position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,.68); color:#fff;
    font-size:.6rem; font-weight:700; letter-spacing:.05em; padding:2px 7px; border-radius:5px;
    font-family:var(--font-mono);
  }

  .mood-cat-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .mood-cat-tab{
    position:relative; display:inline-flex; align-items:center; gap:8px; padding:9px 12px 9px 16px;
    border-radius:100px; border:1.5px solid var(--line); background:var(--paper-warm);
    font-family:var(--font-body); font-weight:600; font-size:.82rem; color:var(--ink-soft);
    cursor:pointer; transition:all .3s var(--ease);
  }
  .mood-cat-tab:hover{transform:translateY(-2px);}
  .mood-cat-tab.active{
    background:linear-gradient(120deg, var(--accent), var(--accent2)); color:#fff; border-color:transparent;
    box-shadow:0 10px 20px -10px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .mood-cat-del{
    width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:.62rem; opacity:.55; transition:opacity .2s ease, background .2s ease;
  }
  .mood-cat-tab:hover .mood-cat-del{opacity:1;}
  .mood-cat-tab.active .mood-cat-del:hover{background:rgba(255,255,255,.28);}
  .mood-cat-tab:not(.active) .mood-cat-del:hover{background:rgba(0,0,0,.08);}
  .mood-cat-add{background:transparent; border-style:dashed;}

  /* ---------- read-only (family access) mode ---------- */
  body.read-only .add-toggle,
  body.read-only .del-btn[data-action="delete"],
  body.read-only .mood-cat-add,
  body.read-only .mood-cat-del,
  body.read-only .mood-del,
  body.read-only label[for="moodFileInput"],
  body.read-only #moodFileInput,
  body.read-only label[for="vendorDocInput"],
  body.read-only #vendorDocInput,
  body.read-only #rsvpDeadlineInput,
  body.read-only .rsvp-deadline-row input{ display:none !important; }
  .ro-field{
    padding:8px 8px; font-size:.85rem; color:var(--ink); font-family:var(--font-body);
    min-height:1.4em; line-height:1.4; display:flex; align-items:center;
  }
  .ro-field.ro-num{font-family:var(--font-mono);}
  .role-badge{
    background:color-mix(in srgb, var(--hero-text) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--hero-text) 30%, transparent); color:var(--hero-text);
    padding:8px 16px; border-radius:100px; font-family:var(--font-body); font-weight:600; font-size:.74rem;
    backdrop-filter:blur(10px); white-space:nowrap;
  }

  /* ---------- lightbox ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:96; display:flex; align-items:center; justify-content:center;
    background:rgba(10,8,6,.94); opacity:0; pointer-events:none; transition:opacity .35s var(--ease);
  }
  #lightbox.show{opacity:1; pointer-events:auto;}
  .lb-stage{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  #lightboxImg{
    max-width:90vw; max-height:85vh; border-radius:8px; touch-action:none; user-select:none;
    -webkit-user-select:none; transition:transform .35s var(--ease), opacity .35s var(--ease);
    box-shadow:0 40px 80px -20px rgba(0,0,0,.6); cursor:zoom-in;
  }
  #lightboxImg.no-transition{transition:none;}
  #lightboxImg.zoomed{cursor:grab;}
  .lb-pdf-wrap{
    display:none; width:min(92vw, 820px); height:85vh; overflow-y:auto; border-radius:10px;
    background:#fff; box-shadow:0 40px 80px -20px rgba(0,0,0,.6); padding:16px;
    -webkit-overflow-scrolling:touch;
  }
  #lightboxPdfPages canvas{display:block; width:100%; height:auto; margin-bottom:14px; border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.1);}
  #lightboxPdfPages canvas:last-child{margin-bottom:0;}
  #lightboxPdfPages p{font-family:var(--font-body); color:#8A7458; text-align:center; padding:40px 0; margin:0;}
  #lightboxImg.dragging{cursor:grabbing;}
  .lb-close, .lb-nav{
    position:absolute; border-radius:50%; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2;
    transition:background .25s ease;
  }
  .lb-close:hover, .lb-nav:hover{background:rgba(255,255,255,.24);}
  .lb-close{top:18px; right:18px; width:42px; height:42px;}
  .lb-nav{top:50%; transform:translateY(-50%); width:46px; height:46px;}
  .lb-nav.prev{left:16px;} .lb-nav.next{right:16px;}
  .lb-counter{
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.7);
    font-family:var(--font-mono); font-size:.76rem; letter-spacing:.05em; z-index:2;
  }
  @media (max-width:720px){
    .lb-nav{display:none;}
    #lightbox.pdf-mode .lb-nav{display:flex;}
    .lb-close{top:14px; right:14px;}
  }

  .side-tabs{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .side-tab{
    flex:1; min-width:200px; text-align:left; padding:16px 20px; border-radius:14px;
    border:1.5px solid var(--line); background:color-mix(in srgb, var(--paper-warm) 70%, transparent);
    cursor:pointer; transition:all .35s var(--ease); font-family:var(--font-body);
  }
  .side-tab:hover{transform:translateY(-2px);}
  .side-tab.active{border-color:var(--accent); box-shadow:0 14px 26px -18px color-mix(in srgb, var(--accent) 50%, transparent);}
  .side-tab .st-name{font-family:var(--font-display); font-weight:600; font-size:1.02rem; color:var(--ink); margin-bottom:5px;}
  .side-tab .st-count{font-family:var(--font-mono); font-size:.74rem; color:var(--ink-soft); margin-bottom:9px;}
  .side-bar{height:6px; border-radius:100px; background:var(--line); overflow:hidden;}
  .side-bar-fill{height:100%; border-radius:100px; background:linear-gradient(90deg, var(--accent), var(--accent2)); transition:width .6s var(--ease);}

  .guest-search{
    position:relative; display:flex; align-items:center; margin-bottom:18px; max-width:360px;
  }
  .guest-search svg{position:absolute; left:14px; width:16px; height:16px; color:var(--ink-soft); pointer-events:none;}
  .guest-search input{
    width:100%; font-family:var(--font-body); font-size:.9rem; padding:11px 38px 11px 40px;
    border:1px solid var(--line); border-radius:100px; background:var(--paper); color:var(--ink);
    transition:border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .guest-search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
  .guest-search button{
    position:absolute; right:10px; background:none; border:none; color:var(--ink-soft); cursor:pointer;
    font-size:.85rem; padding:4px 6px; border-radius:50%; transition:background .2s ease, color .2s ease;
  }
  .guest-search button:hover{background:var(--paper-warm); color:var(--danger);}

  #vendorDocsModal{
    position:fixed; inset:0; z-index:92; display:flex; align-items:center; justify-content:center;
    background:rgba(10,8,6,.55); opacity:0; pointer-events:none; transition:opacity .35s var(--ease); padding:20px;
  }
  #vendorDocsModal.show{opacity:1; pointer-events:auto;}
  .vdocs-card{
    position:relative; max-width:640px; width:100%; max-height:82vh; overflow-y:auto;
    background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:36px 32px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.5); animation:fadeInUp .4s var(--ease) both;
  }
  .vdocs-card .eyebrow{color:var(--ink-soft); margin-bottom:4px;}
  .vdocs-card h2{font-family:var(--font-display); font-weight:600; font-size:1.3rem; margin:0 0 18px; color:var(--ink);}
  #vdocsGrid{margin-top:18px;}
  #auditHistoryModal{
    position:fixed; inset:0; z-index:92; display:flex; align-items:center; justify-content:center;
    background:rgba(10,8,6,.55); opacity:0; pointer-events:none; transition:opacity .35s var(--ease); padding:20px;
  }
  #auditHistoryModal.show{opacity:1; pointer-events:auto;}
  #auditHistoryList{margin-top:16px; display:flex; flex-direction:column; gap:10px;}
  .audit-entry{
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--paper-warm);
    animation:fadeInUp .3s var(--ease) both;
  }
  .audit-entry .ae-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:5px;}
  .audit-entry .ae-actor{
    font-family:var(--font-body); font-weight:700; font-size:.76rem; padding:2px 10px; border-radius:100px;
    background:linear-gradient(120deg, var(--accent), var(--accent2)); color:#fff; white-space:nowrap;
  }
  .audit-entry .ae-time{font-family:var(--font-mono); font-size:.68rem; color:var(--ink-soft); white-space:nowrap;}
  .audit-entry .ae-action{font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px;}
  .audit-entry .ae-action.insert{color:#2E6B3E;}
  .audit-entry .ae-action.update{color:#8C6D3F;}
  .audit-entry .ae-action.delete{color:var(--danger);}
  .audit-entry .ae-details{font-size:.84rem; color:var(--ink); line-height:1.5; word-break:break-word;}
  .doc-btn{
    display:inline-flex; align-items:center; gap:5px; background:var(--paper-warm); border:1px solid var(--line);
    border-radius:100px; padding:6px 11px; font-size:.76rem; color:var(--ink-soft); cursor:pointer;
    font-family:var(--font-body); transition:all .25s ease; white-space:nowrap;
  }
  .doc-btn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px);}

  .rsvp-deadline-row{
    display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;
    background:color-mix(in srgb, var(--paper-warm) 70%, transparent); border:1px solid var(--line);
    border-radius:14px; padding:16px 20px; margin-bottom:20px;
  }
  .rsvp-deadline-row label{display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:6px;}
  .rsvp-deadline-row input{
    font-family:var(--font-body); font-size:.9rem; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; background:var(--paper); color:var(--ink);
  }
  .rsvp-deadline-row .hint{font-size:.78rem; color:var(--ink-soft); max-width:38ch; margin:2px 0 0; flex:1; min-width:200px;}

  /* ---------- who gate ---------- */
  #whoGate{
    position:fixed; inset:0; z-index:55; display:flex; align-items:center; justify-content:center;
    overflow-y:auto; padding:24px 0;
    background:linear-gradient(180deg, var(--hero-top), var(--hero-mid) 55%, var(--hero-bottom));
    transition:opacity .6s var(--ease), visibility .6s, background 1s var(--ease);
  }
  #whoGate.hide{opacity:0; pointer-events:none; visibility:hidden;}
  .who-theme-icon{
    position:absolute; top:20px; right:20px; z-index:3; width:36px; height:36px; border-radius:50%;
    border:2px solid rgba(251,243,228,.7); cursor:pointer; padding:0;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow:0 4px 14px rgba(0,0,0,.3);
    transition:transform .3s var(--ease-snap), background 1s var(--ease);
  }
  .who-theme-icon:hover{transform:scale(1.12) rotate(15deg); border-color:#FBF3E4;}
  .who-card{
    text-align:center; padding:48px 42px; max-width:400px; width:90%;
    border:1px solid color-mix(in srgb, var(--hero-text) 25%, transparent); border-radius:20px;
    background:color-mix(in srgb, var(--hero-text) 8%, transparent);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 40px 70px -30px rgba(0,0,0,.4);
    animation:fadeInUp .6s var(--ease) both; position:relative; z-index:2;
  }
  .who-card .eyebrow{color:var(--hero-text-soft); margin-bottom:8px; text-shadow:0 1px 8px rgba(0,0,0,.35);}
  .who-card h2{font-family:var(--font-display); font-weight:500; font-size:1.5rem; margin:0 0 28px; color:var(--hero-text); text-shadow:0 1px 10px rgba(0,0,0,.35);}
  .who-choices{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .who-btn{
    flex:1; min-width:135px; padding:24px 16px; border-radius:16px;
    border:1.5px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    background:color-mix(in srgb, var(--hero-text) 6%, transparent);
    color:var(--hero-text); font-family:var(--font-display); font-size:1.15rem; font-weight:600;
    cursor:pointer; transition:transform .35s var(--ease-snap), background .35s var(--ease), box-shadow .35s var(--ease), opacity .35s var(--ease);
  }
  .who-btn:hover{transform:translateY(-4px);}
  .who-btn.picked{
    background:linear-gradient(120deg, var(--accent), var(--accent2)); color:#fff; border-color:transparent;
    box-shadow:0 16px 30px -12px color-mix(in srgb, var(--accent) 70%, transparent);
    transform:scale(1.07);
  }
  .who-btn.fade-out{opacity:0; transform:scale(.85); pointer-events:none;}

  /* ---------- pin gate ---------- */
  body:not(.unlocked) #main-content, body:not(.unlocked) .hero{display:none;}
  #pinGate{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    overflow-y:auto; padding:24px 0;
    background:linear-gradient(180deg, var(--hero-top), var(--hero-mid) 55%, var(--hero-bottom));
    transition:background 1s var(--ease);
  }
  body.unlocked #pinGate{display:none;}
  .pin-card{
    text-align:center; padding:46px 44px; max-width:340px; width:90%;
    border:1px solid color-mix(in srgb, var(--hero-text) 25%, transparent); border-radius:20px;
    background:color-mix(in srgb, var(--hero-text) 8%, transparent);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 40px 70px -30px rgba(0,0,0,.4);
    animation:fadeInUp .6s var(--ease) both; position:relative; z-index:2;
  }
  .pin-card .eyebrow{margin-bottom:8px; color:var(--hero-text-soft);}

  .pin-whoami{font-size:.74rem; color:var(--hero-text-soft); margin:-10px 0 22px;}
  .pin-whoami button{
    background:none; border:none; color:inherit; text-decoration:underline; cursor:pointer;
    font-family:inherit; font-size:inherit; padding:0;
  }
  #pinInput{
    width:100%; text-align:center; font-family:var(--font-mono); font-size:1.6rem;
    letter-spacing:.5em; padding:12px 10px 12px 16px; border:1px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    border-radius:10px; background:color-mix(in srgb, var(--hero-text) 8%, transparent); color:var(--hero-text); margin-bottom:16px;
    transition:border-color .3s var(--ease), box-shadow .3s var(--ease);
  }
  #pinInput:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);}
  .pin-card.shake{animation:shake .35s;}
  #pinError{color:#E8877C; font-size:.8rem; min-height:18px; margin-bottom:10px;}
  .pinToggle{display:flex; gap:10px; justify-content:center; margin-bottom:26px;}
  .pinToggle button{
    background:transparent; border:1px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    color:var(--hero-text-soft); padding:7px 16px; border-radius:100px; font-size:.72rem; cursor:pointer;
    font-family:var(--font-body); font-weight:600; transition:all .3s var(--ease);
  }
  .pinToggle button.active{background:var(--accent); border-color:transparent; color:#fff;}

  /* ---------- lock / sound controls ---------- */
  .corner-controls{position:fixed; top:18px; right:20px; z-index:40; display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap; justify-content:flex-end; max-width:min(90vw,420px);}
  #presenceDock{position:fixed; top:18px; left:20px; z-index:40; display:none; flex-direction:column; gap:6px;}

  .presence-chip{
    display:flex; align-items:center; gap:7px;
    background:color-mix(in srgb, var(--hero-text) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    backdrop-filter:blur(10px); color:var(--hero-text); font-size:.72rem; font-weight:600;

    cursor:pointer; transition:all .3s var(--ease);
  }
  .currency-pill button.active{background:var(--accent); color:#fff;}
  .fx-caption{
    position:fixed; top:60px; right:20px; z-index:40; font-family:var(--font-mono); font-size:.62rem;
    color:var(--hero-text-soft); text-align:right; max-width:180px; line-height:1.5; opacity:.8;
    transition:color 1s var(--ease);

    background:none; border:none; color:inherit; text-decoration:underline; cursor:pointer;
    font-family:inherit; font-size:inherit; padding:0;
  }

  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    background:color-mix(in srgb, var(--hero-text) 10%, transparent); backdrop-filter:blur(10px);
    color:var(--hero-text); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .3s var(--ease);
  }
  .icon-btn:hover{background:var(--accent); border-color:transparent; color:#fff; transform:translateY(-2px);}
  .icon-btn.on{background:var(--accent); border-color:transparent; color:#fff;}
  .family-edit-pill{
    width:auto; border-radius:100px; padding:0 14px 0 10px; gap:6px;
    font-family:var(--font-body); font-weight:600; font-size:.72rem; white-space:nowrap;
  }
  .family-edit-pill svg{width:14px; height:14px; flex-shrink:0;}
  .icon-btn svg{width:16px; height:16px;}
  body.unlocked .corner-controls{position:absolute; top:20px;}
  body:not(.unlocked) .corner-controls, body:not(.unlocked) .fx-caption, body:not(.unlocked) #presenceDock{display:none;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; bottom:24px; right:24px; background:var(--ink); color:var(--paper);
    padding:12px 20px; border-radius:10px; font-size:.85rem; opacity:0; transform:translateY(8px);
    transition:all .3s var(--ease); pointer-events:none; max-width:320px; z-index:70;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1; transform:translateY(0);}
  #toast.error{background:var(--danger);}

  /* ---------- portal transition ---------- */
  #portalOverlay{
    position:fixed; inset:0; z-index:90; pointer-events:none;
    background:radial-gradient(circle at var(--ox,50%) var(--oy,50%), var(--p2, #E8A855), var(--p1, #E0AC4C) 70%);
    clip-path:circle(0% at var(--ox,50%) var(--oy,50%));
  }
  #portalOverlay.covering{
    clip-path:circle(150% at var(--ox,50%) var(--oy,50%));
    transition:clip-path .6s var(--portal-ease);
  }
  #portalOverlay.revealing{
    clip-path:circle(0% at var(--ox,50%) var(--oy,50%));
    transition:clip-path .6s var(--portal-ease);
  }

  #printSheet{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printSheet, #printSheet *{visibility:visible;}
    #printSheet{
      display:block !important; position:absolute; top:0; left:0; width:100%;
      padding:30px; color:#000; background:#fff;
    }
    #printSheet h1{font-family:var(--font-display); font-size:1.6rem; margin:0 0 4px;}
    #printSheet .print-date{color:#555; margin:0 0 26px; font-family:var(--font-body);}
    #printSheet h2{font-family:var(--font-display); font-size:1.05rem; margin:24px 0 8px; border-bottom:1px solid #ccc; padding-bottom:5px;}
    #printSheet table{width:100%; border-collapse:collapse; font-size:.82rem; font-family:var(--font-body);}
    #printSheet th, #printSheet td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
    #printSheet p{font-family:var(--font-body); font-size:.88rem;}
  }

  /* ---------- responsive ---------- */
  @media (max-width:720px){
    .hero{min-height:74vh; padding:150px 16px 56px;}
    .corner-controls{top:12px; right:12px; gap:6px;}
    .icon-btn{width:32px; height:32px;}
    .icon-btn svg{width:14px; height:14px;}
    .currency-pill button{padding:6px 9px; font-size:.62rem;}
    .fx-caption{top:50px; right:12px; font-size:.58rem; max-width:140px;}
    #presenceDock{top:12px; left:12px;}
    .presence-chip{font-size:.66rem; padding:6px 10px;}
    .stat-row{margin-top:-42px;}
    .data-table thead{display:none;}
    table.data-table{min-width:0;}
    .data-table, .data-table tbody, .data-table tr, .data-table td{display:block; width:100%;}
    .data-table tr{border:1px solid var(--line); border-radius:12px; margin-bottom:12px; padding:8px 4px;}
    .data-table td{border-bottom:none; display:flex; align-items:center; gap:10px; padding:7px 10px;}
    .data-table td::before{
      content:attr(data-label); font-family:var(--font-mono); font-size:.62rem; text-transform:uppercase;
      letter-spacing:.06em; color:var(--ink-soft); width:88px; flex-shrink:0;
    }
    .data-table td.actions{justify-content:flex-end;}
    .data-table td.wrap-col{min-width:0; max-width:none;}
    .data-table td.num-col{min-width:0;}
    .data-table td.num-col input{min-width:0;}
    .section-tabs{
      flex-wrap:wrap; width:100%; overflow-x:visible; border-radius:16px;
      justify-content:flex-start; padding:5px;
    }
    .section-tabs button{flex:1 1 auto; justify-content:center; padding:10px 12px; font-size:.76rem; gap:6px;}
    .section-tabs button svg{width:14px; height:14px;}
    #tabIndicator{display:none;}
    .section-tabs button.active{
      background:linear-gradient(120deg, var(--accent), var(--accent2)); color:#fff;
      box-shadow:0 8px 16px -8px color-mix(in srgb, var(--accent) 65%, transparent);
    }
  }
</style>

  data:{ wedding:{vendors:[],tasks:[],guests:[],moodCategories:[],moodPhotos:{},vendorDocs:{}}, homecoming:{vendors:[],tasks:[],guests:[],moodCategories:[],moodPhotos:{},vendorDocs:{}} }
};

/* ---------------- currency (LKR entry, live LKR->AUD rate) ---------------- */
const FX_CACHE_KEY = 'wedplanner_fx';
const FX_FALLBACK_RATE = 0.0056; // used only if no cached/live rate is available at all

function fmtMoney(lkrValue){
  if (lkrValue === null || lkrValue === undefined || lkrValue === '') return '—';
  if (state.displayCurrency === 'LKR'){
    return new Intl.NumberFormat('en-LK', {style:'currency', currency:'LKR', maximumFractionDigits:0}).format(lkrValue);
  }
  const rate = state.fxRate ?? FX_FALLBACK_RATE;
  return new Intl.NumberFormat('en-AU', {style:'currency', currency:'AUD', maximumFractionDigits:2}).format(lkrValue * rate);
}

// Plain comma-grouped number, no currency symbol — used for Price/Deposit/Remaining in the
// vendor table, since the currency toggle (LKR/AUD) already makes clear which unit is shown.
function fmtNum(lkrValue){
  if (lkrValue === null || lkrValue === undefined || lkrValue === '') return '—';
  const shown = toDisplayAmount(lkrValue);
  const maxFrac = state.displayCurrency === 'LKR' ? 0 : 2;
  return new Intl.NumberFormat('en-US', { maximumFractionDigits: maxFrac }).format(shown);
}

function computeSpent(eventId){
  const vendors = state.data[eventId].vendors;
  return vendors.reduce((sum, v) => {
    if (v.payment_status === 'paid_full') return sum + (Number(v.price) || 0);
    if (v.payment_status === 'deposit_paid') return sum + (Number(v.deposit_amount) || 0);
    return sum;
  }, 0);
}

// For table inputs tagged data-currency="true": show converted value when viewing in AUD,
// but always store/send the true LKR amount so LKR stays the source of truth.
function toDisplayAmount(lkrValue){
  if (lkrValue === null || lkrValue === undefined || lkrValue === '') return '';
  if (state.displayCurrency === 'LKR') return lkrValue;
  const rate = state.fxRate ?? FX_FALLBACK_RATE;
  return Math.round(lkrValue * rate * 100) / 100;
}
function fromDisplayAmount(enteredValue){
  if (enteredValue === '' || enteredValue === null || enteredValue === undefined) return null;
  const num = Number(enteredValue);
  if (Number.isNaN(num)) return null;
  if (state.displayCurrency === 'LKR') return num;
  const rate = state.fxRate ?? FX_FALLBACK_RATE;
  return Math.round(num / rate);
}

function renderFxCaption(){
  const cap = document.getElementById('fxCaption');
  if (!cap) return;
  if (state.fxRate === null){
    cap.innerHTML = 'Loading live rate…';
    return;
  }
  const audFor1000 = (1000 * state.fxRate).toFixed(2);
  const when = state.fxUpdated ? new Date(state.fxUpdated).toLocaleDateString('en-AU', {day:'numeric', month:'short'}) : '—';
  cap.innerHTML = `1,000 LKR ≈ ${audFor1000} AUD<br>rate as of ${when} · <button id="fxRefresh">refresh</button>`;
  const btn = document.getElementById('fxRefresh');
  if (btn) btn.addEventListener('click', () => fetchExchangeRate(true));
}

async function fetchExchangeRate(force){
  const cached = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');
  const cacheAgeMs = cached ? Date.now() - cached.fetchedAt : Infinity;
  if (cached && !force){
    state.fxRate = cached.rate;
    state.fxUpdated = cached.date;
    renderFxCaption();
  }
  if (cached && cacheAgeMs < 12 * 60 * 60 * 1000 && !force) return; // fresh enough, skip network

  const urls = [
    'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/lkr.min.json',
    'https://latest.currency-api.pages.dev/v1/currencies/lkr.min.json'
  ];
  for (const url of urls){
    try{
      const res = await fetch(url);
      if (!res.ok) continue;
      const json = await res.json();
      const rate = json.lkr && json.lkr.aud;
      if (typeof rate === 'number'){
        state.fxRate = rate;
        state.fxUpdated = json.date || new Date().toISOString();
        localStorage.setItem(FX_CACHE_KEY, JSON.stringify({ rate, date: state.fxUpdated, fetchedAt: Date.now() }));
        renderFxCaption();
        if (state.displayCurrency === 'AUD'){ renderSummary(); renderSection(); }
        return;
      }
    } catch(e){ /* try next source */ }
  }
  if (!cached){
    state.fxRate = FX_FALLBACK_RATE;
    state.fxUpdated = null;
    toast('Could not reach live exchange rate — using an approximate fallback.', true);
    renderFxCaption();
  }
}

document.getElementById('currencyPill').addEventListener('click', e => {
  const btn = e.target.closest('[data-currency]');
  if (!btn) return;
  state.displayCurrency = btn.dataset.currency;
  localStorage.setItem('wedplanner_currency', state.displayCurrency);
  document.querySelectorAll('#currencyPill button').forEach(b => b.classList.toggle('active', b === btn));
  renderSummary();
  renderSection();
});

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'show error' : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.className='', 2600);
}

function burstSparkles(x, y){
  const glyphs = ['✦','✧','❋','✳'];
  for (let i = 0; i < 8; i++){
    const s = document.createElement('span');
    s.textContent = glyphs[i % glyphs.length];
    const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.4;
    const dist = 36 + Math.random() * 28;
    s.style.cssText = `position:fixed; left:${x}px; top:${y}px; z-index:80; pointer-events:none;
      font-size:${10 + Math.random()*8}px; color:var(--accent2);
      filter:drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 70%, transparent));
      transition:transform .75s cubic-bezier(.22,1,.36,1), opacity .75s ease; opacity:1; transform:translate(0,0) scale(1);`;
    document.body.appendChild(s);
    requestAnimationFrame(() => {
      s.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist - 14}px) scale(.3)`;
      s.style.opacity = '0';
    });
    setTimeout(() => s.remove(), 800);
  }
}

/* ---------------- sound (Web Audio, no external files) ---------------- */
let audioCtx = null;
let soundOn = localStorage.getItem('wedplanner_sound') !== '0';
function ctx(){ if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playChime(kind){
  if (!soundOn) return;
  try{
    const ac = ctx();
    const now = ac.currentTime;
    const notes = kind === 'whoosh' ? [392, 587.33] : kind === 'unlock' ? [523.25, 659.25, 783.99] : [659.25, 987.77];
    notes.forEach((freq, i) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = now + i * 0.09;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.09, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      osc.connect(gain).connect(ac.destination);
      osc.start(t); osc.stop(t + 0.95);
    });
  } catch(e){ /* audio not available, fail silently */ }
}

/* ---------------- confetti ---------------- */
function fireConfetti(){
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed; inset:0; z-index:94; pointer-events:none;';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const cx = canvas.getContext('2d');
  const cs = getComputedStyle(document.body);
  const colors = [cs.getPropertyValue('--accent').trim() || '#E0AC4C', cs.getPropertyValue('--accent2').trim() || '#C98A94', '#FFFFFF'];
  const particles = Array.from({length: 150}, () => ({
    x: Math.random() * canvas.width, y: -20 - Math.random() * canvas.height * 0.4,
    vx: (Math.random() - 0.5) * 3.2, vy: 2 + Math.random() * 3,
    size: 5 + Math.random() * 5, color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360, vr: (Math.random() - 0.5) * 10, shape: Math.random() < 0.5 ? 'rect' : 'circle'
  }));
  let frame = 0;
  function anim(){
    frame++;
    cx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.rot += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot * Math.PI / 180);
      cx.fillStyle = p.color;
      if (p.shape === 'rect') cx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else { cx.beginPath(); cx.arc(0, 0, p.size / 2, 0, Math.PI * 2); cx.fill(); }
      cx.restore();
    });
    if (frame < 210) requestAnimationFrame(anim);
    else canvas.remove();
  }
  anim();
}

const msKey = eventId => `wedplanner_ms_${eventId}`;
function getAchieved(eventId){ try{ return JSON.parse(localStorage.getItem(msKey(eventId)) || '[]'); } catch(e){ return []; } }
function hasAchieved(eventId, id){ return getAchieved(eventId).includes(id); }
function markAchieved(eventId, id){
  const a = getAchieved(eventId);
  if (!a.includes(id)){ a.push(id); localStorage.setItem(msKey(eventId), JSON.stringify(a)); }
}

let achQueue = [];
let achShowing = false;
function queueAchievement(a){
  achQueue.push(a);
  if (!achShowing) showNextAchievement();
}
function showNextAchievement(){
  const a = achQueue.shift();
  if (!a){ achShowing = false; return; }
  achShowing = true;
  document.getElementById('achTitle').textContent = a.title;
  document.getElementById('achMsg').textContent = a.msg;
  const modal = document.getElementById('achievementModal');
  modal.classList.add('show');
  fireConfetti();
  playChime('unlock');
  clearTimeout(modal._timer);
  modal._timer = setTimeout(() => dismissAchievement(), 3400);
}
function dismissAchievement(){
  const modal = document.getElementById('achievementModal');
  clearTimeout(modal._timer);
  modal.classList.remove('show');
  setTimeout(showNextAchievement, 450);
}
document.getElementById('achievementModal').addEventListener('click', dismissAchievement);

function checkMilestones(eventId){
  const ev = state.events[eventId];
  const d = state.data[eventId];
  const found = [];

  if (ev.event_date){
    const daysLeft = Math.floor((new Date(ev.event_date + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
    [100, 50, 30, 7, 1, 0].forEach(mark => {
      const id = `days-${mark}`;
      if (daysLeft <= mark && !hasAchieved(eventId, id)){
        found.push({ id,
          title: mark === 0 ? "It's the day!" : `${mark} Day${mark === 1 ? '' : 's'} To Go!`,
          msg: mark === 0 ? "Today's the day — breathe, and enjoy it." : 'The countdown just hit a milestone.'
        });
      }
    });
  }

  const pct = (arr, pred) => arr.length ? arr.filter(pred).length / arr.length : 0;
  const checks = [
    { key:'vendors', pred:v=>v.status==='booked', id:'vendors-100', title:'Every Vendor Booked!', msg:'The lineup is locked in.' },
    { key:'tasks', pred:t=>t.completed, id:'tasks-100', title:'Checklist Complete!', msg:'Nothing left to do but wait.' },
    { key:'guests', pred:g=>g.rsvp_status==='yes', id:'guests-100', title:"Everyone's Confirmed!", msg:'The guest list is set.' }
  ];
  checks.forEach(c => {
    const arr = d[c.key];
    if (arr.length && pct(arr, c.pred) === 1 && !hasAchieved(eventId, c.id)) found.push(c);
  });

  found.forEach(a => { markAchieved(eventId, a.id); queueAchievement(a); });
}

async function logAudit(action, table, recordLabel, details){
  if (state.accessLevel === 'admin') return; // only family-role actions need auditing

function fmtAuditVal(v){
  if (v === null || v === undefined || v === '') return '(empty)';
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  return String(v);
}

async function insertRow(table, payload){

  if (error){ toast(error.message, true); return false; }
  toast('Added');

  logAudit('insert', table, label, `Added ${TABLE_SINGULAR[table] || table}${label ? ': ' + label : ''}`);
  await refreshCurrentTable(table);

async function updateRow(table, id, payload){
  if (guardWrite()) return;
  const list = state.data[state.currentEvent][table];
  const row = list.find(r => r.id === id);
  const before = row ? { ...row } : null;
  const { error } = await supabaseClient.from(table).update(payload).eq('id', id);
  if (error){ toast(error.message, true); return; }
  if (row) Object.assign(row, payload);
  renderStats();
  if (before){

      .filter(([k, v]) => before[k] !== v)
      .map(([k, v]) => `${k}: ${fmtAuditVal(before[k])} → ${fmtAuditVal(v)}`)
      .join('; ');
    if (changes) logAudit('update', table, label, changes);
  }

/* ---------------- render: hero / stats ---------------- */
function countUp(el, target){
  if (!el) return;
  const dur = 800, start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(eased * target);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

let clockTimer = null;
function startCountdownClock(targetDate){
  clearInterval(clockTimer);
  let lastDays = null;
  function tick(){
    const hmsEl = document.getElementById('stampHms');
    const numEl = document.getElementById('stampNum');
    if (!hmsEl){ clearInterval(clockTimer); return; }
    const diff = targetDate - new Date();
    if (diff <= 0){
      clearInterval(clockTimer);
      renderSummary();
      return;
    }
    const totalSeconds = Math.floor(diff / 1000);
    const h = String(Math.floor((totalSeconds % 86400) / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    hmsEl.textContent = `${h}:${m}:${s}`;
    const daysLeft = Math.ceil(diff / 86400000);
    if (numEl && daysLeft !== lastDays){
      numEl.textContent = daysLeft;
      lastDays = daysLeft;
    }
  }
  tick();
  clockTimer = setInterval(tick, 1000);
}

function vendorRemaining(v){
  const price = Number(v.price) || 0;
  if (v.payment_status === 'paid_full') return 0;
  const paidSoFar = v.payment_status === 'deposit_paid' ? (Number(v.deposit_amount) || 0) : 0;
  return Math.max(0, price - paidSoFar);
}

function vendorSortFn(a, b){
  const ao = a.sort_order, bo = b.sort_order;
  if (ao != null && bo != null) return ao - bo;
  if (ao != null) return -1;
  if (bo != null) return 1;
  return (a.created_at || '').localeCompare(b.created_at || '');
}

async function moveVendor(id, direction){
  if (guardWrite()) return;
  const rows = [...state.data[state.currentEvent].vendors].sort(vendorSortFn);
  const idx = rows.findIndex(r => r.id === id);
  const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
  if (idx === -1 || swapIdx < 0 || swapIdx >= rows.length) return;

  // Lazily assign order values to any rows that don't have one yet, so future
  // moves resolve predictably instead of relying on created_at ties.
  if (rows.some(r => r.sort_order == null)){
    rows.forEach((r, i) => { r.sort_order = (i + 1) * 10; });
    await Promise.all(rows.map(r => supabaseClient.from('vendors').update({ sort_order: r.sort_order }).eq('id', r.id)));
  }

  const a = rows[idx], b = rows[swapIdx];
  const aOrder = a.sort_order, bOrder = b.sort_order;
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    supabaseClient.from('vendors').update({ sort_order: bOrder }).eq('id', a.id),
    supabaseClient.from('vendors').update({ sort_order: aOrder }).eq('id', b.id)
  ]);
  if (e1 || e2){ toast((e1 || e2).message, true); return; }
  a.sort_order = bOrder; b.sort_order = aOrder;
  renderSection();
}

function renderVendors(){
  const rows = [...state.data[state.currentEvent].vendors].sort(vendorSortFn);
  const statusOptions = Object.entries(STATUS_LABELS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  const paymentOptions = Object.entries(PAYMENT_LABELS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  const cur = state.displayCurrency;

const pdfThumbCache = {};
async function ensurePdfThumb(url, onReady){
  if (pdfThumbCache[url]){ onReady(pdfThumbCache[url]); return; }
  try{
    const pdf = await pdfjsLib.getDocument(url).promise;
    const page = await pdf.getPage(1);
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = 320 / baseViewport.width;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
    pdfThumbCache[url] = dataUrl;
    onReady(dataUrl);
  } catch(e){ /* leave as generic document tile */ }
}

async function fetchMoodCategories(eventId){
  return await fetchTable('moodboard_categories', eventId);
}

async function fetchMoodPhotos(eventId, categoryId){
  try{
    const { data, error } = await supabaseClient.storage.from('moodboard').list(`${eventId}/${categoryId}`, { sortBy: { column: 'created_at', order: 'desc' } });
    if (error || !data) return [];
    return data.filter(f => f.name !== '.emptyFolderPlaceholder').map(f => ({
      name: f.name,
      url: supabaseClient.storage.from('moodboard').getPublicUrl(`${eventId}/${categoryId}/${f.name}`).data.publicUrl
    }));
  } catch(e){ return []; }
}

async function ensureMoodPhotosLoaded(eventId, categoryId){
  if (!categoryId) return;
  const d = state.data[eventId];
  if (!d.moodPhotos) d.moodPhotos = {};
  if (d.moodPhotos[categoryId] !== undefined) return;
  d._moodLoading = d._moodLoading || {};
  if (d._moodLoading[categoryId]) return;
  d._moodLoading[categoryId] = true;
  const photos = await fetchMoodPhotos(eventId, categoryId);
  d.moodPhotos[categoryId] = photos;
  d._moodLoading[categoryId] = false;
  if (state.currentEvent === eventId && state.currentSection === 'moodboard') renderSection();
}

async function addMoodCategory(name){
  if (guardWrite()) return;
  name = name.trim();
  if (!name) return;
  const eventId = state.currentEvent;
  const { data, error } = await supabaseClient.from('moodboard_categories').insert([{ event_id: eventId, name }]).select();
  if (error){ toast(error.message, true); return; }
  state.data[eventId].moodCategories.push(data[0]);
  state.moodCategory = data[0].id;
  renderSection();
  toast('Category added');
}

async function deleteMoodCategory(categoryId, categoryName){
  if (guardWrite()) return;
  const eventId = state.currentEvent;
  let photos = (state.data[eventId].moodPhotos || {})[categoryId];
  if (photos === undefined) photos = await fetchMoodPhotos(eventId, categoryId);
  const msg = photos.length
    ? `Delete "${categoryName}" and its ${photos.length} photo${photos.length===1?'':'s'}? This can't be undone.`
    : `Delete "${categoryName}"?`;
  if (!confirm(msg)) return;
  if (photos.length){
    await supabaseClient.storage.from('moodboard').remove(photos.map(p => `${eventId}/${categoryId}/${p.name}`));
  }
  const { error } = await supabaseClient.from('moodboard_categories').delete().eq('id', categoryId);
  if (error){ toast(error.message, true); return; }
  state.data[eventId].moodCategories = state.data[eventId].moodCategories.filter(c => c.id !== categoryId);
  if (state.data[eventId].moodPhotos) delete state.data[eventId].moodPhotos[categoryId];
  if (state.moodCategory === categoryId) state.moodCategory = null;
  renderSection();
  logAudit('delete', 'moodboard_categories', categoryName, `Deleted mood board category "${categoryName}"${photos.length ? ` and its ${photos.length} photo${photos.length===1?'':'s'}` : ''}`);
  toast('Category deleted');
}

async function handleMoodUpload(files){
  if (guardWrite()) return;
  if (!files || !files.length || !state.moodCategory) return;
  toast('Uploading…');
  const eventId = state.currentEvent, categoryId = state.moodCategory;
  for (const file of files){
    const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    const path = `${eventId}/${categoryId}/${Date.now()}-${safeName}`;
    const { error } = await supabaseClient.storage.from('moodboard').upload(path, file);
    if (error){ toast(error.message, true); }
  }
  state.data[eventId].moodPhotos[categoryId] = await fetchMoodPhotos(eventId, categoryId);
  renderSection();
  toast('Photo added');
}

async function handleMoodDelete(name){
  if (guardWrite()) return;
  if (!confirm('Remove this photo?')) return;
  const eventId = state.currentEvent, categoryId = state.moodCategory;
  const cat = state.data[eventId].moodCategories.find(c => c.id === categoryId);
  const { error } = await supabaseClient.storage.from('moodboard').remove([`${eventId}/${categoryId}/${name}`]);
  if (error){ toast(error.message, true); return; }
  state.data[eventId].moodPhotos[categoryId] = await fetchMoodPhotos(eventId, categoryId);
  renderSection();
  logAudit('delete', 'moodboard_categories', name.replace(/^\d+-/, ''), `Deleted a photo from "${cat ? cat.name : categoryId}"`);
  toast('Removed');
}

async function pollFamilyEditable(){
  if (state.accessLevel === 'admin') return; // admin already has full access regardless
  try{
    const { data, error } = await supabaseClient.from('events').select('family_editable').eq('id', state.currentEvent).single();
    if (error || !data) return;
    const ev = state.events[state.currentEvent];
    if (ev && ev.family_editable !== data.family_editable){

      renderSummary();
      renderSection();
      toast(data.family_editable ? "You can now edit this event" : "This event is now view-only");

async function toggleFamilyEditable(){

function buildPrintSheet(){
  const ev = state.events[state.currentEvent];
  const d = state.data[state.currentEvent];
  const dateStr = ev.event_date
    ? new Date(ev.event_date + 'T00:00:00').toLocaleDateString('en-AU', { weekday:'long', year:'numeric', month:'long', day:'numeric' })
    : 'Date not yet set';
  const vendorRows = d.vendors.map(v => `<tr><td>${esc(v.category||'')}</td><td>${esc(v.name)}</td><td>${esc(v.contact_phone||'')}</td><td>${STATUS_LABELS[v.status]||v.status}</td><td>${PAYMENT_LABELS[v.payment_status]||'Not paid'}</td></tr>`).join('')
    || '<tr><td colspan="5">No vendors added</td></tr>';
  const openTasks = d.tasks.filter(t => !t.completed).sort((a,b) => (a.due_date||'9999') < (b.due_date||'9999') ? -1 : 1);
  const taskRows = openTasks.map(t => `<tr><td>${esc(t.title)}</td><td>${t.due_date || '—'}</td><td>${esc(t.category||'')}</td></tr>`).join('')
    || '<tr><td colspan="3">Everything is done</td></tr>';
  const guestsYes = d.guests.filter(g => g.rsvp_status === 'yes');
  const headcount = guestsYes.reduce((s,g) => s + (g.party_size || 1), 0);

  document.getElementById('printSheet').innerHTML = `
    <h1>${THEME_COPY[state.currentEvent].title} — Day-Of Run Sheet</h1>
    <p class="print-date">${dateStr}</p>
    <h2>Vendors</h2>
    <table><thead><tr><th>Category</th><th>Name</th><th>Contact</th><th>Status</th><th>Payment</th></tr></thead><tbody>${vendorRows}</tbody></table>

    <table><thead><tr><th>Task</th><th>Due</th><th>Category</th></tr></thead><tbody>${taskRows}</tbody></table>
    <h2>Guests</h2>
    <p>${guestsYes.length} confirmed &middot; ${headcount} total headcount including plus-ones</p>`;
}

async function downloadFullBackup(){
  const btn = document.getElementById('backupBtn');
  btn.style.opacity = '.5';
  btn.disabled = true;
  toast('Gathering data…');
  try{
    const backup = { exported_at: new Date().toISOString(), events: {} };
    for (const eventId of ['wedding', 'homecoming']){
      const [vendors, tasks, guests, moodCategories] = await Promise.all([
        fetchTable('vendors', eventId), fetchTable('tasks', eventId),
        fetchTable('guests', eventId), fetchTable('moodboard_categories', eventId)
      ]);
      backup.events[eventId] = { ...state.events[eventId], vendors, tasks, guests, moodCategories };
    }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `wedding-planner-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
  } catch(e){
    toast('Backup failed — try again', true);
  } finally {
    btn.style.opacity = '';
    btn.disabled = false;
  }
}

function initPresence(myName){
  presenceChannel = supabaseClient.channel('wedplanner-presence', {

  });
  presenceChannel
    .on('presence', { event: 'sync' }, renderPresence)

      }

function renderPresence(){
  if (!presenceChannel) return;
  const dock = document.getElementById('presenceDock');
  if (!dock) return;
  const myName = localStorage.getItem('wedplanner_who');
  const people = Object.values(presenceChannel.presenceState()).flat();
  const byName = new Map();
  people.filter(p => p.name !== myName).forEach(p => {
    const existing = byName.get(p.name);
    if (!existing || p.at > existing.at) byName.set(p.name, p);
  });
  const others = [...byName.values()];
  if (!others.length){ dock.style.display = 'none'; dock.innerHTML = ''; return; }
  dock.style.display = 'flex';
  dock.innerHTML = others.map(p => `<div class="presence-chip"><span class="presence-dot"></span>${esc(p.name)} is here${p.event ? ' &middot; ' + THEME_COPY[p.event].title : ''}</div>`).join('');
