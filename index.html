/* ---------------- lightbox (pinch-zoom + swipe photo viewer) ---------------- */
let lbImages = [];
let lbIndex = 0;
let lbScale = 1, lbPanX = 0, lbPanY = 0;

function dist(a, b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
function clamp(n, min, max){ return Math.min(max, Math.max(min, n)); }

function openLightbox(images, index){
  if (!images.length) return;
  lbImages = images;
  lbIndex = index;
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
  showLightboxImage();
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightboxPdfPages').innerHTML = '';
  document.body.style.overflow = '';
}
async function renderPdfIntoLightbox(url){
  const pagesEl = document.getElementById('lightboxPdfPages');
  pagesEl.innerHTML = '<p>Loading document…</p>';
  try{
    const pdf = await pdfjsLib.getDocument(url).promise;
    pagesEl.innerHTML = '';
    for (let n = 1; n <= pdf.numPages; n++){
      const page = await pdf.getPage(n);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      pagesEl.appendChild(canvas);
    }
  } catch(e){
    pagesEl.innerHTML = '<p>Could not preview this document — it may still open if you download it.</p>';
  }
}
function showLightboxImage(){
  lbScale = 1; lbPanX = 0; lbPanY = 0;
  const item = lbImages[lbIndex];
  const isPdf = item.name.toLowerCase().endsWith('.pdf');
  const img = document.getElementById('lightboxImg');
  const pdfWrap = document.getElementById('lightboxPdfWrap');
  document.getElementById('lightbox').classList.toggle('pdf-mode', isPdf);
  if (isPdf){
    img.style.display = 'none';
    img.src = '';
    pdfWrap.style.display = 'block';
    renderPdfIntoLightbox(item.url);
  } else {
    pdfWrap.style.display = 'none';
    document.getElementById('lightboxPdfPages').innerHTML = '';
    img.style.display = 'block';
    img.classList.remove('zoomed');
    img.src = item.url;
    img.style.transform = 'translate(0px,0px) scale(1)';
    img.style.opacity = '1';
  }
  document.getElementById('lightboxCounter').textContent = lbImages.length > 1 ? `${lbIndex + 1} / ${lbImages.length}` : '';
  document.getElementById('lbPrev').style.visibility = lbIndex > 0 ? 'visible' : 'hidden';
  document.getElementById('lbNext').style.visibility = lbIndex < lbImages.length - 1 ? 'visible' : 'hidden';
}
function lbNext(){ if (lbIndex < lbImages.length - 1){ lbIndex++; showLightboxImage(); } }
function lbPrev(){ if (lbIndex > 0){ lbIndex--; showLightboxImage(); } }
function applyLbTransform(){
  const img = document.getElementById('lightboxImg');
  img.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbScale})`;
  img.classList.toggle('zoomed', lbScale > 1.02);
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', lbPrev);
document.getElementById('lbNext').addEventListener('click', lbNext);
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox' || e.target.id === 'lbStage') closeLightbox();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('show')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowRight') lbNext();
  else if (e.key === 'ArrowLeft') lbPrev();
});

const lbImg = document.getElementById('lightboxImg');

lbImg.addEventListener('wheel', e => {
  e.preventDefault();
  lbScale = clamp(lbScale + (e.deltaY < 0 ? 0.18 : -0.18), 1, 4);
  if (lbScale === 1){ lbPanX = 0; lbPanY = 0; }
  applyLbTransform();
}, { passive:false });

lbImg.addEventListener('dblclick', () => {
  lbScale = lbScale > 1 ? 1 : 2.4;
  lbPanX = 0; lbPanY = 0;
  applyLbTransform();
});

let lbTouchMode = null;
let lbStartX = 0, lbStartY = 0, lbPanStartX = 0, lbPanStartY = 0;
let lbPinchStartDist = 0, lbPinchStartScale = 1, lbSwipeDx = 0;

lbImg.addEventListener('touchstart', e => {
  lbImg.classList.add('no-transition');
  if (e.touches.length === 2){
    lbTouchMode = 'pinch';
    lbPinchStartDist = dist(e.touches[0], e.touches[1]);
    lbPinchStartScale = lbScale;
  } else if (e.touches.length === 1){
    lbStartX = e.touches[0].clientX; lbStartY = e.touches[0].clientY;
    lbPanStartX = lbPanX; lbPanStartY = lbPanY;
    lbSwipeDx = 0;
    lbTouchMode = lbScale > 1.02 ? 'pan' : 'swipe';
  }
}, { passive:true });

lbImg.addEventListener('touchmove', e => {
  if (lbTouchMode === 'pinch' && e.touches.length === 2){
    const d = dist(e.touches[0], e.touches[1]);
    lbScale = clamp(lbPinchStartScale * (d / lbPinchStartDist), 1, 4);
    applyLbTransform();
  } else if (lbTouchMode === 'pan' && e.touches.length === 1){
    lbPanX = lbPanStartX + (e.touches[0].clientX - lbStartX);
    lbPanY = lbPanStartY + (e.touches[0].clientY - lbStartY);
    applyLbTransform();
  } else if (lbTouchMode === 'swipe' && e.touches.length === 1){
    lbSwipeDx = e.touches[0].clientX - lbStartX;
    lbImg.style.transform = `translateX(${lbSwipeDx}px) scale(1)`;
    lbImg.style.opacity = String(1 - Math.min(0.55, Math.abs(lbSwipeDx) / 500));
  }
}, { passive:true });

lbImg.addEventListener('touchend', () => {
  lbImg.classList.remove('no-transition');
  if (lbTouchMode === 'swipe'){
    if (lbSwipeDx < -70) lbNext();
    else if (lbSwipeDx > 70) lbPrev();
    else { lbImg.style.transform = 'translateX(0px) scale(1)'; lbImg.style.opacity = '1'; }
  } else if (lbTouchMode === 'pinch' && lbScale <= 1.02){
    lbScale = 1; lbPanX = 0; lbPanY = 0; applyLbTransform();
  }
  lbTouchMode = null;
});

// mouse-drag pan when zoomed in (desktop)
let lbMouseDown = false;
lbImg.addEventListener('mousedown', e => {
  if (lbScale <= 1.02) return;
  lbMouseDown = true;
  lbImg.classList.add('dragging', 'no-transition');
  lbStartX = e.clientX; lbStartY = e.clientY;
  lbPanStartX = lbPanX; lbPanStartY = lbPanY;
});
window.addEventListener('mousemove', e => {
  if (!lbMouseDown) return;
  lbPanX = lbPanStartX + (e.clientX - lbStartX);
  lbPanY = lbPanStartY + (e.clientY - lbStartY);
  applyLbTransform();
});
window.addEventListener('mouseup', () => {
  lbMouseDown = false;
  lbImg.classList.remove('dragging', 'no-transition');
});

document.getElementById('sectionContent').addEventListener('click', e => {
  if (e.target.closest('.mood-del')) return;
  const item = e.target.closest('.mood-item[data-lb-index]');
  if (item){
    const images = (state.data[state.currentEvent].moodPhotos || {})[state.moodCategory] || [];
    openLightbox(images, Number(item.dataset.lbIndex || 0));
  }
});

async function openAuditHistory(){
  document.getElementById('auditHistoryTitle').textContent = THEME_COPY[state.currentEvent].title;
  const modal = document.getElementById('auditHistoryModal');
  const list = document.getElementById('auditHistoryList');
  modal.classList.add('show');
  list.innerHTML = `<p class="empty-row" style="text-align:center; padding:30px 0;">Loading…</p>`;
  const { data, error } = await supabaseClient
    .from('audit_log').select('*')
    .eq('event_id', state.currentEvent)
    .order('created_at', { ascending: false })
    .limit(150);
  if (error){
    list.innerHTML = `<p class="empty-row" style="text-align:center; padding:30px 0;">Couldn't load history — ${esc(error.message)}</p>`;
    return;
  }
  if (!data.length){
    list.innerHTML = `<p class="empty-row" style="text-align:center; padding:30px 0;">No family edits recorded yet for ${esc(THEME_COPY[state.currentEvent].title)}.</p>`;
    return;
  }
  const actionLabel = { insert:'Added', update:'Changed', delete:'Deleted' };
  list.innerHTML = data.map(entry => {
    const when = new Date(entry.created_at).toLocaleString('en-AU', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
    return `
    <div class="audit-entry">
      <div class="ae-top">
        <span class="ae-actor">${esc(entry.actor)}</span>
        <span class="ae-time">${esc(when)}</span>
      </div>
      <div class="ae-action ${esc(entry.action)}">${actionLabel[entry.action] || entry.action}</div>
      <div class="ae-details">${esc(entry.details || entry.record_label || '')}</div>
    </div>`;
  }).join('');
}
function closeAuditHistory(){
  document.getElementById('auditHistoryModal').classList.remove('show');
}
document.getElementById('auditHistoryBtn').addEventListener('click', openAuditHistory);
document.getElementById('auditHistoryClose').addEventListener('click', closeAuditHistory);
document.getElementById('auditHistoryModal').addEventListener('click', e => {
  if (e.target.id === 'auditHistoryModal') closeAuditHistory();
});

document.getElementById('vdocsClose').addEventListener('click', closeVendorDocsModal);
document.getElementById('vendorDocsModal').addEventListener('click', e => {
  if (e.target.id === 'vendorDocsModal') closeVendorDocsModal();
});
document.getElementById('vendorDocInput').addEventListener('change', e => handleVendorDocUpload(e.target.files));
document.getElementById('vdocsGrid').addEventListener('click', e => {
  const del = e.target.closest('[data-vdoc-del]');
  if (del){ handleVendorDocDelete(del.dataset.vdocDel); return; }
  const item = e.target.closest('[data-vdoc-index]');
  if (item){
    const eventId = state.currentEvent, vendorId = state.vendorDocsFor;
    const images = (state.data[eventId].vendorDocs || {})[vendorId] || [];
    openLightbox(images, Number(item.dataset.vdocIndex || 0));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('vendorDocsModal').classList.contains('show')) closeVendorDocsModal();
  if (e.key === 'Escape' && document.getElementById('auditHistoryModal').classList.contains('show')) closeAuditHistory();
});

const UNLOCK_KEY = 'wedplanner_unlocked';
const ROLE_KEY = 'wedplanner_role';

function applyRoleState(role){
  state.accessLevel = role;
  if (role === 'bride_family'){ state.currentEvent = BRIDE_FAMILY_EVENT; state.eventLocked = true; }
  else if (role === 'groom_family'){ state.currentEvent = GROOM_FAMILY_EVENT; state.eventLocked = true; }
  else { state.eventLocked = false; }
  document.body.dataset.theme = state.currentEvent;
}

function finishUnlock(role){
  applyRoleState(role);
  localStorage.setItem(UNLOCK_KEY, '1');
  localStorage.setItem(ROLE_KEY, role);
  document.body.classList.add('unlocked');
  document.getElementById('whoGate').classList.add('hide');
  playChime('unlock');
  init();
  if (role === 'admin' && !presenceChannel){
    initPresence(localStorage.getItem('wedplanner_who') || 'Guest');
  }
  if (role !== 'admin' && !familyEditablePollTimer){
    familyEditablePollTimer = setInterval(pollFamilyEditable, 15000);
  }
}
let familyEditablePollTimer = null;

const ROLE_PIN = { admin: APP_PIN, bride_family: BRIDE_FAMILY_PIN, groom_family: GROOM_FAMILY_PIN };
const ROLE_LABEL = { bride_family: "Bride's Family", groom_family: "Groom's Family" };
let pendingRole = null;
let pendingWho = null;

function resetProfilePicker(){
  pendingRole = null; pendingWho = null;
  document.querySelectorAll('.who-btn').forEach(b => b.classList.remove('picked', 'fade-out'));
  document.getElementById('whoGate').classList.remove('hide');
  document.getElementById('pinInput').value = '';
  document.getElementById('pinError').textContent = '';
}

document.querySelectorAll('.who-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    pendingRole = btn.dataset.role;
    pendingWho = btn.dataset.who || null;
    document.querySelectorAll('.who-btn').forEach(b => b.classList.add(b === btn ? 'picked' : 'fade-out'));
    playChime('sparkle');
    setTimeout(() => {
      document.getElementById('whoGate').classList.add('hide');
      const whoami = document.getElementById('pinWhoami');
      if (whoami){
        const label = pendingWho || ROLE_LABEL[pendingRole];
        whoami.innerHTML = `Entering as <strong>${esc(label)}</strong> &middot; <button type="button" id="switchWhoBtn">Not you?</button>`;
        document.getElementById('switchWhoBtn').addEventListener('click', resetProfilePicker);
      }
      document.getElementById('pinInput').value = '';
      document.getElementById('pinError').textContent = '';
      document.getElementById('pinInput').focus();
    }, 550);
  });
});

document.getElementById('pinForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('pinInput');
  const card = document.querySelector('.pin-card');
  const val = input.value.trim();

  if (!pendingRole){ resetProfilePicker(); return; }

  if (val === String(ROLE_PIN[pendingRole])){
    if (pendingRole === 'admin'){
      if (pendingWho) localStorage.setItem('wedplanner_who', pendingWho);
      state.currentEvent = document.body.dataset.theme || 'wedding';
      document.querySelectorAll('#eventTabs .portal-btn').forEach(b => b.classList.toggle('active', b.dataset.event === state.currentEvent));
    }
    finishUnlock(pendingRole);
  } else {
    document.getElementById('pinError').textContent = 'Wrong PIN — try again.';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    input.value = '';
    input.focus();
  }
});


document.getElementById('switchWhoBtn2').addEventListener('click', () => {
  localStorage.removeItem(UNLOCK_KEY);
  localStorage.removeItem(ROLE_KEY);
  localStorage.removeItem('wedplanner_who');
  location.reload();
});

window.addEventListener('resize', () => {
  moveTabIndicator(document.querySelector('#sectionTabs button.active'));
  autoGrowTextareas(document.getElementById('sectionContent'));
  updateRotateTip();
});

/* ---------------- boot ---------------- */
let storedRole = localStorage.getItem(ROLE_KEY);
if (localStorage.getItem(UNLOCK_KEY) === '1' && !storedRole){
  // pre-existing session from before family-access roles existed — only the admin
  // PIN could unlock the app back then, so this is safe to assume.
  storedRole = 'admin';
  localStorage.setItem(ROLE_KEY, 'admin');
}
if (localStorage.getItem(UNLOCK_KEY) === '1' && storedRole){
  finishUnlock(storedRole);
}
</script>
