<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wedding &amp; Homecoming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* shared, theme-stable */
    --ink:#2B2420;
    --ink-soft:#8A7458;
    --paper:#FFFCF5;
    --paper-warm:#FBF1DD;
    --line:#E9D9B8;
    --danger:#B23B2E;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-snap:cubic-bezier(.34,1.56,.64,1);
    --portal-ease:cubic-bezier(.65,0,.35,1);

    /* wedding (default) — ivory, warm gold, rose gold */
    --accent:#C79A4B;
    --accent-deep:#9C7530;
    --accent2:#C98A94;
    --accent2-light:#F8E6E4;
    --hero-top:#FFF6E0;
    --hero-mid:#FCE9C4;
    --hero-bottom:#F1D6A0;
    --hero-text:#3A2A18;
    --hero-text-soft:#83643C;
  }
  body[data-theme="homecoming"]{
    /* homecoming — ivory, navy, burgundy */
    --accent:#2A3D63;
    --accent-deep:#141D30;
    --accent2:#7A2233;
    --accent2-light:#F0E1E3;
    --hero-top:#050810;
    --hero-mid:#0F1930;
    --hero-bottom:#1B2740;
    --hero-text:#F3E9CE;
    --hero-text-soft:#B9A98A;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  ::selection{background:var(--accent); color:var(--paper);}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    transition:background 1s var(--ease);
  }

  @keyframes fadeInUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  @keyframes floatBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  @keyframes twinkle{ 0%,100%{opacity:.2; transform:scale(.7);} 50%{opacity:1; transform:scale(1.2);} }
  @keyframes shimmerSweep{ 0%{background-position:-150% 0;} 100%{background-position:250% 0;} }
  @keyframes lanternRise{
    0%{transform:translateY(0) translateX(0) rotate(0);}
    100%{transform:translateY(-140vh) translateX(var(--drift,30px)) rotate(3deg);}
  }
  @keyframes petalFall{
    0%{transform:translateY(-10vh) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:.9;}
    90%{opacity:.85;}
    100%{transform:translateY(115vh) translateX(var(--drift,40px)) rotate(340deg); opacity:0;}
  }
  @keyframes spinSlow{ to{transform:rotate(360deg);} }
  @keyframes spinSlowRev{ to{transform:rotate(-360deg);} }
  @keyframes shootingStar{
    0%{transform:translate(0,0) rotate(-18deg); opacity:0; width:0;}
    4%{opacity:1; width:90px;}
    16%{opacity:0; width:0;}
    100%{opacity:0;}
  }
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 45%, transparent));}
    50%{filter:drop-shadow(0 0 26px color-mix(in srgb, var(--accent) 70%, transparent));}
  }
  @keyframes shake{ 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} 100%{transform:translateX(0);} }

  /* ================= HERO WORLD ================= */
  .hero{
    position:relative; min-height:82vh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:80px 20px 64px;
    background:linear-gradient(180deg, var(--hero-top) 0%, var(--hero-mid) 48%, var(--hero-bottom) 100%);
    transition:background 1s var(--ease);
  }
  .hero-layer{position:absolute; inset:0; overflow:hidden; pointer-events:none;}

  /* -- sun (wedding) -- */
  .sunGlow{
    position:absolute; top:-14%; right:-6%; width:52vw; height:52vw; max-width:640px; max-height:640px;
    border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 70%);
    filter:blur(6px);
    opacity:0; transition:opacity 1s var(--ease);
  }
  .sunRays{
    position:absolute; top:-10%; right:-4%; width:44vw; height:44vw; max-width:560px; max-height:560px;
    opacity:0; transition:opacity 1s var(--ease); animation:spinSlow 90s linear infinite;
  }
  body[data-theme="wedding"] .sunGlow, body[data-theme="wedding"] .sunRays{opacity:1;}

  /* -- moon + rose window (homecoming) -- */
  .moonGlow{
    position:absolute; top:-10%; left:-6%; width:34vw; height:34vw; max-width:420px; max-height:420px;
    border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--hero-text) 65%, transparent) 0%, transparent 70%);
    filter:blur(4px); opacity:0; transition:opacity 1s var(--ease);
  }
  .roseWindow{
    position:absolute; top:4%; right:2%; width:46vw; height:46vw; max-width:520px; max-height:520px;
    opacity:0; transition:opacity 1.2s var(--ease); animation:spinSlowRev 140s linear infinite;
  }
  body[data-theme="homecoming"] .moonGlow{opacity:1;}
  body[data-theme="homecoming"] .roseWindow{opacity:.85;}

  /* -- stars (homecoming) -- */
  .stars{position:absolute; inset:0; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="homecoming"] .stars{opacity:1;}
  .star{position:absolute; background:var(--hero-text); border-radius:50%; animation:twinkle 3s ease-in-out infinite;}
  .shootStar{
    position:absolute; height:1.5px; width:0; background:linear-gradient(90deg, transparent, #fff, transparent);
    transform-origin:left center; animation:shootingStar 6s ease-in infinite;
  }

  /* -- lanterns (wedding) -- */
  .lanterns{position:absolute; inset:0; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="wedding"] .lanterns{opacity:1;}
  .lantern{
    position:absolute; bottom:-80px; width:22px; height:30px;
    border-radius:48% 48% 44% 44% / 58% 58% 42% 42%;
    background:radial-gradient(circle at 50% 35%, #FFF3D2, var(--accent) 62%, var(--accent-deep) 100%);
    box-shadow:0 0 18px 6px color-mix(in srgb, var(--accent) 55%, transparent);
    animation:lanternRise linear infinite;
  }
  .lantern::after{content:''; position:absolute; left:50%; top:-7px; width:1px; height:7px; background:var(--accent-deep); transform:translateX(-50%);}

  /* -- petals (homecoming) -- */
  .petals{position:absolute; inset:0; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="homecoming"] .petals{opacity:1;}
  .petal{
    position:absolute; top:-30px; width:11px; height:15px; border-radius:70% 10% 70% 10%;
    background:linear-gradient(135deg, var(--accent2), color-mix(in srgb, var(--accent2) 60%, #000));
    animation:petalFall linear infinite;
  }

  /* -- botanical border (wedding) -- */
  .vineBorder{position:absolute; left:0; right:0; bottom:-2px; height:70px; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="wedding"] .vineBorder{opacity:.55;}

  /* -- candelabra border (homecoming) -- */
  .candleBorder{position:absolute; left:0; right:0; bottom:-2px; height:70px; opacity:0; transition:opacity 1s var(--ease);}
  body[data-theme="homecoming"] .candleBorder{opacity:.5;}

  .hero-inner{position:relative; z-index:2;}
  .eyebrow{
    font-family:var(--font-mono); font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--hero-text-soft); margin:0 0 14px; transition:color 1s var(--ease);
  }
  .hero h1{
    font-family:var(--font-display); font-weight:600; font-size:clamp(2.6rem, 7vw, 5.2rem);
    margin:0; color:var(--hero-text); letter-spacing:-.01em; line-height:1.02;
    text-shadow:0 2px 40px color-mix(in srgb, var(--accent) 35%, transparent);
    transition:color 1s var(--ease);
  }
  .hero .tagline{
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:clamp(1rem,2.2vw,1.35rem);
    color:var(--hero-text-soft); margin:16px 0 40px; transition:color 1s var(--ease); min-height:1.6em;
  }

  .portals{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-bottom:52px;}
  .portal-btn{
    position:relative; overflow:hidden; cursor:pointer; border:1.5px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    background:color-mix(in srgb, var(--hero-text) 8%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--hero-text); font-family:var(--font-display); font-size:1.05rem; font-weight:500;
    padding:16px 34px; border-radius:100px; display:flex; align-items:center; gap:10px;
    transition:transform .4s var(--ease-snap), background .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease);
  }
  .portal-btn svg{width:18px; height:18px; flex-shrink:0;}
  .portal-btn:hover{transform:translateY(-3px);}
  .portal-btn.active{
    background:linear-gradient(120deg, var(--accent), var(--accent2));
    color:#fff; border-color:transparent;
    box-shadow:0 14px 30px -12px color-mix(in srgb, var(--accent) 70%, transparent);
    transform:translateY(-2px) scale(1.04);
  }

  .heroStamp{
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
    width:128px; height:128px; border-radius:50%;
    border:1.5px dashed color-mix(in srgb, var(--hero-text) 55%, transparent);
    background:color-mix(in srgb, var(--hero-text) 6%, transparent);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    animation:floatBob 5s ease-in-out infinite, glowPulse 3.2s ease-in-out infinite;
    font-family:var(--font-mono); color:var(--hero-text); margin-bottom:8px;
  }
  .heroStamp .n{font-size:2.1rem; font-weight:600; line-height:1;}
  .heroStamp .u{font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; margin-top:4px; opacity:.8;}
  .heroDate{margin-top:10px;}
  .heroDate label{
    display:block; font-family:var(--font-mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--hero-text-soft); margin-bottom:6px;
  }
  .heroDate input{
    font-family:var(--font-body); font-size:.9rem; border:1px solid color-mix(in srgb, var(--hero-text) 35%, transparent);
    background:color-mix(in srgb, var(--hero-text) 8%, transparent); color:var(--hero-text);
    padding:7px 10px; border-radius:8px; text-align:center;
  }
  .heroDate input::-webkit-calendar-picker-indicator{filter:invert(.5);}

  .scrollCue{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:2;
    color:var(--hero-text-soft); animation:floatBob 2.4s ease-in-out infinite; opacity:.75;
  }

  /* ================= CONTENT ================= */
  #main-content{max-width:1180px; margin:0 auto; padding:0 24px 90px; position:relative; z-index:1;}

  .stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:16px; margin-top:-56px; margin-bottom:36px; position:relative; z-index:3;}
  .stat-card{
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line); border-radius:16px; padding:18px 20px;
    box-shadow:0 24px 44px -30px rgba(0,0,0,.35);
    transition:transform .35s var(--ease-snap), box-shadow .35s var(--ease);
    animation:fadeInUp .6s var(--ease) both;
  }
  .stat-card:hover{transform:translateY(-4px); box-shadow:0 30px 50px -26px color-mix(in srgb, var(--accent) 45%, transparent);}
  .stat-card .icon{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); margin-bottom:12px;
  }
  .stat-card .icon svg{width:18px; height:18px; stroke:#fff; fill:none;}
  .stat-card .v{font-family:var(--font-mono); font-size:1.3rem; font-weight:600; color:var(--accent);}
  .stat-card .l{font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}

  /* ---------- section nav ---------- */
  .section-tabs{
    display:flex; gap:6px; background:var(--paper-warm); border:1px solid var(--line);
    border-radius:100px; padding:6px; margin-bottom:32px; position:relative; overflow-x:auto;
    width:fit-content; max-width:100%;
  }
  .section-tabs button{
    position:relative; z-index:2; background:transparent; border:none; cursor:pointer;
    padding:11px 22px; font-family:var(--font-body); font-weight:600; font-size:.82rem;
    color:var(--ink-soft); white-space:nowrap; border-radius:100px; display:flex; align-items:center; gap:8px;
    transition:color .35s var(--ease);
  }
  .section-tabs button svg{width:15px; height:15px; stroke:currentColor; fill:none; flex-shrink:0;}
  .section-tabs button.active{color:#fff;}
  #tabIndicator{
    position:absolute; top:6px; bottom:6px; left:6px; border-radius:100px; z-index:1;
    background:linear-gradient(120deg, var(--accent), var(--accent2));
    box-shadow:0 8px 18px -8px color-mix(in srgb, var(--accent) 65%, transparent);
    transition:left .45s var(--ease-snap), width .45s var(--ease-snap), background 1s var(--ease);
  }

  main{padding-top:4px;}

  /* ---------- add form ---------- */
  .add-toggle{
    background:var(--ink); color:var(--paper); border:none; border-radius:10px;
    padding:11px 18px; font-family:var(--font-body); font-weight:600; font-size:.82rem;
    cursor:pointer; margin-bottom:18px; transition:transform .3s var(--ease-snap), box-shadow .3s var(--ease);
  }
  .add-toggle:hover{transform:translateY(-2px); box-shadow:0 12px 20px -10px rgba(0,0,0,.4);}
  .add-form{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:14px; background:color-mix(in srgb, var(--paper-warm) 85%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:16px;
    padding:0 20px; margin-bottom:0;
    max-height:0; opacity:0; overflow:hidden; transform:translateY(-8px);
    transition:max-height .5s var(--ease), opacity .35s var(--ease), padding .5s var(--ease), margin .5s var(--ease), transform .5s var(--ease);
  }
  .add-form.open{max-height:560px; opacity:1; padding:20px; margin-bottom:26px; transform:translateY(0);}
  .add-form .full{grid-column:1/-1;}
  .field label{display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; font-family:var(--font-body); font-size:.9rem; padding:9px 10px;
    border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);
    transition:border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .add-form .submit-row{grid-column:1/-1; display:flex; justify-content:flex-end; gap:10px;}
  .btn-primary{
    position:relative; overflow:hidden;
    background:linear-gradient(120deg, var(--accent), var(--accent2));
    color:#fff; border:none; padding:10px 22px;
    border-radius:10px; font-weight:600; font-size:.82rem; cursor:pointer; font-family:var(--font-body);
    transition:transform .3s var(--ease-snap), box-shadow .3s var(--ease);
  }
  .btn-primary::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 20%, rgba(255,255,255,.55) 40%, transparent 60%);
    background-size:250% 100%; background-position:-150% 0; opacity:0; transition:opacity .3s ease;
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 14px 24px -12px color-mix(in srgb, var(--accent) 70%, transparent);}
  .btn-primary:hover::after{opacity:1; animation:shimmerSweep 1.4s ease-in-out infinite;}
  .btn-ghost{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line); padding:10px 18px;
    border-radius:10px; font-size:.82rem; cursor:pointer; font-family:var(--font-body);
    transition:border-color .3s var(--ease), color .3s var(--ease);
  }
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}

  /* ---------- data table ---------- */
  .table-wrap{
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line); border-radius:16px; padding:6px 8px;
    box-shadow:0 30px 50px -34px rgba(0,0,0,.3);
  }
  table.data-table{width:100%; border-collapse:collapse; font-size:.87rem;}
  .data-table th{
    text-align:left; font-family:var(--font-mono); font-size:.64rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); padding:12px 12px 10px; border-bottom:1px solid var(--line);
  }
  .data-table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .data-table tbody tr:last-child td{border-bottom:none;}
  .data-table tbody tr{animation:fadeInUp .4s var(--ease) both; transition:background .3s var(--ease);}
  .data-table tr:hover td{background:color-mix(in srgb, var(--accent) 6%, transparent);}
  .data-table input, .data-table select, .data-table textarea{
    border:1px solid transparent; background:transparent; font-family:var(--font-body);
    font-size:.85rem; width:100%; padding:6px 7px; border-radius:7px; color:var(--ink);
    transition:border-color .25s var(--ease), background .25s var(--ease);
  }
  .data-table input:hover, .data-table select:hover, .data-table textarea:hover{border-color:var(--line); background:var(--paper);}
  .data-table input:focus, .data-table select:focus, .data-table textarea:focus{
    outline:none; border-color:var(--accent); background:var(--paper); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .data-table input[type="number"]{font-family:var(--font-mono);}
  .del-btn{
    background:none; border:none; color:var(--danger); cursor:pointer; font-size:1.1rem;
    line-height:1; padding:4px 6px; transition:transform .2s var(--ease-snap), opacity .2s ease; opacity:.55;
  }
  .del-btn:hover{transform:scale(1.2) rotate(90deg); opacity:1;}
  .empty-row td{padding:34px 10px; text-align:center; color:var(--ink-soft); font-style:italic;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:600;}
  .badge.researching{background:#EDEAE1; color:#7A7362;}
  .badge.contacted{background:#E4EAF2; color:#37567F;}
  .badge.booked{background:#E1EBE7; color:#2C4A44;}
  .badge.paid_deposit{background:#F4EAD3; color:#8C6D3F;}
  .badge.paid_full{background:#DFEEDD; color:#2E6B3E;}
  .badge.pending{background:#EDEAE1; color:#7A7362;}
  .badge.yes{background:#DFEEDD; color:#2E6B3E;}
  .badge.no{background:#F0E1E3; color:#8C3B47;}

  .budget-summary{display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
  .budget-summary .stat-card{padding:14px 18px; flex:1; min-width:150px;}

  /* ---------- pin gate ---------- */
  body:not(.unlocked) #main-content, body:not(.unlocked) .hero{display:none;}
  #pinGate{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--hero-top), var(--hero-mid) 55%, var(--hero-bottom));
    transition:background 1s var(--ease);
  }
  body.unlocked #pinGate{display:none;}
  .pin-card{
    text-align:center; padding:46px 44px; max-width:340px; width:90%;
    border:1px solid color-mix(in srgb, var(--hero-text) 25%, transparent); border-radius:20px;
    background:color-mix(in srgb, var(--hero-text) 8%, transparent);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 40px 70px -30px rgba(0,0,0,.4);
    animation:fadeInUp .6s var(--ease) both; position:relative; z-index:2;
  }
  .pin-card .eyebrow{margin-bottom:8px; color:var(--hero-text-soft);}
  .pin-card h2{font-family:var(--font-display); font-weight:500; font-size:1.5rem; margin:0 0 22px; color:var(--hero-text);}
  #pinInput{
    width:100%; text-align:center; font-family:var(--font-mono); font-size:1.6rem;
    letter-spacing:.5em; padding:12px 10px 12px 16px; border:1px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    border-radius:10px; background:color-mix(in srgb, var(--hero-text) 8%, transparent); color:var(--hero-text); margin-bottom:16px;
    transition:border-color .3s var(--ease), box-shadow .3s var(--ease);
  }
  #pinInput:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);}
  .pin-card.shake{animation:shake .35s;}
  #pinError{color:#E8877C; font-size:.8rem; min-height:18px; margin-bottom:10px;}
  .pinToggle{display:flex; gap:10px; justify-content:center; margin-bottom:26px;}
  .pinToggle button{
    background:transparent; border:1px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    color:var(--hero-text-soft); padding:7px 16px; border-radius:100px; font-size:.72rem; cursor:pointer;
    font-family:var(--font-body); font-weight:600; transition:all .3s var(--ease);
  }
  .pinToggle button.active{background:var(--accent); border-color:transparent; color:#fff;}

  /* ---------- lock / sound controls ---------- */
  .corner-controls{position:fixed; top:18px; right:20px; z-index:40; display:flex; gap:8px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid color-mix(in srgb, var(--hero-text) 30%, transparent);
    background:color-mix(in srgb, var(--hero-text) 10%, transparent); backdrop-filter:blur(10px);
    color:var(--hero-text); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .3s var(--ease);
  }
  .icon-btn:hover{background:var(--accent); border-color:transparent; color:#fff; transform:translateY(-2px);}
  .icon-btn svg{width:16px; height:16px;}
  body.unlocked .corner-controls{position:absolute; top:20px;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; bottom:24px; right:24px; background:var(--ink); color:var(--paper);
    padding:12px 20px; border-radius:10px; font-size:.85rem; opacity:0; transform:translateY(8px);
    transition:all .3s var(--ease); pointer-events:none; max-width:320px; z-index:70;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1; transform:translateY(0);}
  #toast.error{background:var(--danger);}

  /* ---------- portal transition ---------- */
  #portalOverlay{
    position:fixed; inset:0; z-index:90; pointer-events:none;
    background:radial-gradient(circle at var(--ox,50%) var(--oy,50%), var(--p2, #F1D6A0), var(--p1, #C79A4B) 70%);
    clip-path:circle(0% at var(--ox,50%) var(--oy,50%));
  }
  #portalOverlay.covering{
    clip-path:circle(150% at var(--ox,50%) var(--oy,50%));
    transition:clip-path .6s var(--portal-ease);
  }
  #portalOverlay.revealing{
    clip-path:circle(0% at var(--ox,50%) var(--oy,50%));
    transition:clip-path .6s var(--portal-ease);
  }

  /* ---------- responsive ---------- */
  @media (max-width:720px){
    .hero{min-height:74vh; padding:100px 16px 56px;}
    .stat-row{margin-top:-42px;}
    .data-table thead{display:none;}
    .data-table, .data-table tbody, .data-table tr, .data-table td{display:block; width:100%;}
    .data-table tr{border:1px solid var(--line); border-radius:12px; margin-bottom:12px; padding:8px 4px;}
    .data-table td{border-bottom:none; display:flex; align-items:center; gap:10px; padding:7px 10px;}
    .data-table td::before{
      content:attr(data-label); font-family:var(--font-mono); font-size:.62rem; text-transform:uppercase;
      letter-spacing:.06em; color:var(--ink-soft); width:88px; flex-shrink:0;
    }
    .data-table td.actions{justify-content:flex-end;}
  }
</style>
</head>

<script>
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const VENDOR_CATS = ['Venue','Catering','Photography','Videography','Florist','Cake & Desserts','Attire','Hair & Makeup','Music / DJ','Officiant','Transport','Decor & Styling','Invitations & Stationery','Rentals','Other'];
const BUDGET_CATS = [...VENDOR_CATS, 'Rings','Honeymoon / Travel','Contingency'];
const TASK_CATS = ['Venue','Legal & Paperwork','Attire','Vendors','Guests','Design & Decor','Logistics','Other'];
const GUEST_SIDES = ['His side','Her side','Family','Friends','Other'];

const STATUS_LABELS = {
  researching:'Researching', contacted:'Contacted', booked:'Booked',
  paid_deposit:'Deposit paid', paid_full:'Paid in full'
};
const RSVP_LABELS = { pending:'Pending', yes:'Yes', no:'No' };

const THEME_COPY = {
  wedding:{
    title:'Wedding', dateLabel:'Wedding date',
    taglines:[
      'Golden hour, lantern light, and everything in bloom.',
      'Every lantern lit is one step closer.',
      'Warm light, warmer promises.'
    ],
    p1:'#C79A4B', p2:'#F1D6A0'
  },
  homecoming:{
    title:'Homecoming', dateLabel:'Homecoming date',
    taglines:[
      'Candlelight, stars, and a night to remember.',
      'Under the stained glass and a thousand candles.',
      'A midnight ballroom, made for us.'
    ],
    p1:'#1F2C47', p2:'#7A2233'
  }
};

const state = {
  currentEvent:'wedding',
  currentSection:'vendors',
  events:{ wedding:{id:'wedding', name:'Wedding', event_date:null}, homecoming:{id:'homecoming', name:'Homecoming', event_date:null} },
  data:{ wedding:{vendors:[],budget_items:[],tasks:[],guests:[]}, homecoming:{vendors:[],budget_items:[],tasks:[],guests:[]} }
};

const AUD = n => n === null || n === undefined || n === '' ? '—' : new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n);

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'show error' : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.className='', 2600);
}

function burstSparkles(x, y){
  const glyphs = ['✦','✧','❋','✳'];
  for (let i = 0; i < 8; i++){
    const s = document.createElement('span');
    s.textContent = glyphs[i % glyphs.length];
    const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.4;
    const dist = 36 + Math.random() * 28;
    s.style.cssText = `position:fixed; left:${x}px; top:${y}px; z-index:80; pointer-events:none;
      font-size:${10 + Math.random()*8}px; color:var(--accent2);
      filter:drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 70%, transparent));
      transition:transform .75s cubic-bezier(.22,1,.36,1), opacity .75s ease; opacity:1; transform:translate(0,0) scale(1);`;
    document.body.appendChild(s);
    requestAnimationFrame(() => {
      s.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist - 14}px) scale(.3)`;
      s.style.opacity = '0';
    });
    setTimeout(() => s.remove(), 800);
  }
}

/* ---------------- sound (Web Audio, no external files) ---------------- */
let audioCtx = null;
let soundOn = localStorage.getItem('wedplanner_sound') !== '0';
function ctx(){ if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playChime(kind){
  if (!soundOn) return;
  try{
    const ac = ctx();
    const now = ac.currentTime;
    const notes = kind === 'whoosh' ? [392, 587.33] : kind === 'unlock' ? [523.25, 659.25, 783.99] : [659.25, 987.77];
    notes.forEach((freq, i) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = now + i * 0.09;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.09, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      osc.connect(gain).connect(ac.destination);
      osc.start(t); osc.stop(t + 0.95);
    });
  } catch(e){ /* audio not available, fail silently */ }
}
function updateSoundIcon(){
  document.getElementById('soundWaves').style.opacity = soundOn ? '1' : '.25';
}
document.getElementById('soundToggle').addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem('wedplanner_sound', soundOn ? '1' : '0');
  updateSoundIcon();
  if (soundOn) playChime('sparkle');
});
updateSoundIcon();

/* ---------------- portal transition ---------------- */
function portalSwitch(x, y, toTheme, applyFn){
  const overlay = document.getElementById('portalOverlay');
  const copy = THEME_COPY[toTheme];
  overlay.style.setProperty('--ox', x + 'px');
  overlay.style.setProperty('--oy', y + 'px');
  overlay.style.setProperty('--p1', copy.p1);
  overlay.style.setProperty('--p2', copy.p2);
  overlay.classList.remove('revealing');
  void overlay.offsetWidth;
  overlay.classList.add('covering');
  playChime('whoosh');
  setTimeout(() => {
    applyFn();
    overlay.classList.remove('covering');
    overlay.classList.add('revealing');
  }, 560);
}

function datalist(id, options){
  return `<datalist id="${id}">${options.map(o=>`<option value="${o}">`).join('')}</datalist>`;
}

/* ---------------- data access ---------------- */
async function fetchTable(table, eventId){
  const { data, error } = await supabaseClient.from(table).select('*').eq('event_id', eventId).order('created_at');
  if (error){ toast(error.message, true); return []; }
  return data;
}

async function refreshCurrentTable(table){
  state.data[state.currentEvent][table] = await fetchTable(table, state.currentEvent);
  renderStats();
  renderSection();
}

async function insertRow(table, payload){
  const { error } = await supabaseClient.from(table).insert([{ ...payload, event_id: state.currentEvent }]);
  if (error){ toast(error.message, true); return false; }
  toast('Added');
  await refreshCurrentTable(table);
  return true;
}

async function updateRow(table, id, payload){
  const { error } = await supabaseClient.from(table).update(payload).eq('id', id);
  if (error){ toast(error.message, true); return; }
  const list = state.data[state.currentEvent][table];
  const row = list.find(r => r.id === id);
  if (row) Object.assign(row, payload);
  renderStats();
}

async function deleteRow(table, id){
  const { error } = await supabaseClient.from(table).delete().eq('id', id);
  if (error){ toast(error.message, true); return; }
  toast('Deleted');
  await refreshCurrentTable(table);
}

async function updateEventDate(dateVal){
  const eventId = state.currentEvent;
  const { error } = await supabaseClient.from('events').update({ event_date: dateVal || null }).eq('id', eventId);
  if (error){ toast(error.message, true); return; }
  state.events[eventId].event_date = dateVal || null;
  renderSummary();
}

/* ---------------- render: hero / stats ---------------- */
function countUp(el, target){
  if (!el) return;
  const dur = 800, start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(eased * target);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function renderSummary(){
  const ev = state.events[state.currentEvent];
  const copy = THEME_COPY[state.currentEvent];
  document.getElementById('heroTitle').textContent = copy.title;
  document.getElementById('heroTagline').textContent = copy.taglines[Math.floor(Math.random()*copy.taglines.length)];
  document.getElementById('heroDateLabel').textContent = copy.dateLabel;
  document.getElementById('eventDateInput').value = ev.event_date || '';

  const stampEl = document.getElementById('heroStamp');
  if (ev.event_date){
    const days = Math.ceil((new Date(ev.event_date + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
    const target = Math.abs(days);
    stampEl.innerHTML = `<div class="n" id="stampNum">0</div><div class="u">${days >= 0 ? 'days to go' : 'days since'}</div>`;
    countUp(document.getElementById('stampNum'), target);
  } else {
    stampEl.innerHTML = `<div class="u" style="font-size:.62rem;">set a<br>date</div>`;
  }

  const d = state.data[state.currentEvent];
  const vendorsBooked = d.vendors.filter(v => ['booked','paid_deposit','paid_full'].includes(v.status)).length;
  const plannedSum = d.budget_items.reduce((s,b)=> s + (Number(b.planned_amount)||0), 0);
  const actualSum = d.budget_items.reduce((s,b)=> s + (Number(b.actual_amount)||0), 0);
  const tasksDone = d.tasks.filter(t=>t.completed).length;
  const guestsYes = d.guests.filter(g=>g.rsvp_status==='yes').length;

  document.getElementById('statRow').innerHTML = `
    <div class="stat-card"><div class="icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5M3 9v11h18V9M3 9h18"/></svg></div>
      <div class="v">${vendorsBooked}/${d.vendors.length}</div><div class="l">Vendors booked</div></div>
    <div class="stat-card"><div class="icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5h4.5a2 2 0 0 1 0 4H9"/></svg></div>
      <div class="v">${AUD(actualSum)}</div><div class="l">of ${AUD(plannedSum)} spent</div></div>
    <div class="stat-card"><div class="icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg></div>
      <div class="v">${tasksDone}/${d.tasks.length}</div><div class="l">Tasks done</div></div>
    <div class="stat-card"><div class="icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg></div>
      <div class="v">${guestsYes}/${d.guests.length}</div><div class="l">Guests confirmed</div></div>`;
}
function renderStats(){ renderSummary(); }

/* ---------------- render: sections ---------------- */
function renderSection(){
  const el = document.getElementById('sectionContent');
  let html;
  if (state.currentSection === 'vendors') html = renderVendors();
  else if (state.currentSection === 'budget') html = renderBudget();
  else if (state.currentSection === 'tasks') html = renderTasks();
  else html = renderGuests();
  el.innerHTML = `<div class="table-wrap">${html}</div>`;
}

function renderVendors(){
  const rows = state.data[state.currentEvent].vendors;
  const statusOptions = Object.entries(STATUS_LABELS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  const body = rows.length ? rows.map(r => `
    <tr>
      <td data-label="Category"><input list="vendorCatList" data-table="vendors" data-id="${r.id}" data-field="category" value="${esc(r.category)}"></td>
      <td data-label="Name"><input data-table="vendors" data-id="${r.id}" data-field="name" value="${esc(r.name)}"></td>
      <td data-label="Contact"><input data-table="vendors" data-id="${r.id}" data-field="contact_phone" value="${esc(r.contact_phone||'')}" placeholder="phone / email"></td>
      <td data-label="Status">
        <select data-table="vendors" data-id="${r.id}" data-field="status" class="badge ${r.status}">${
          Object.entries(STATUS_LABELS).map(([v,l])=>`<option value="${v}" ${v===r.status?'selected':''}>${l}</option>`).join('')
        }</select>
      </td>
      <td data-label="Price"><input type="number" data-table="vendors" data-id="${r.id}" data-field="price" value="${r.price ?? ''}" placeholder="0"></td>
      <td data-label="Deposit paid" style="text-align:center;"><input type="checkbox" data-table="vendors" data-id="${r.id}" data-field="deposit_paid" ${r.deposit_paid?'checked':''}></td>
      <td data-label="Notes"><input data-table="vendors" data-id="${r.id}" data-field="notes" value="${esc(r.notes||'')}"></td>
      <td data-label="" class="actions"><button class="del-btn" data-action="delete" data-table="vendors" data-id="${r.id}">✕</button></td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="8">No vendors yet for this event — add your first one above.</td></tr>`;

  return `
    ${datalist('vendorCatList', VENDOR_CATS)}
    <button class="add-toggle" data-toggle="vendorForm">+ Add vendor</button>
    <form class="add-form" id="vendorForm">
      <div class="field"><label>Category</label><input list="vendorCatList" id="v_category" required></div>
      <div class="field"><label>Vendor name</label><input id="v_name" required></div>
      <div class="field"><label>Phone / email</label><input id="v_contact"></div>
      <div class="field"><label>Status</label><select id="v_status">${statusOptions}</select></div>
      <div class="field"><label>Price (AUD)</label><input id="v_price" type="number"></div>
      <div class="field"><label>Deposit (AUD)</label><input id="v_deposit" type="number"></div>
      <div class="field full"><label>Notes</label><input id="v_notes"></div>
      <div class="submit-row">
        <button type="button" class="btn-ghost" data-toggle="vendorForm">Cancel</button>
        <button type="submit" class="btn-primary">Save vendor</button>
      </div>
    </form>
    <table class="data-table">
      <thead><tr><th>Category</th><th>Name</th><th>Contact</th><th>Status</th><th>Price</th><th>Deposit paid</th><th>Notes</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

function renderBudget(){
  const rows = state.data[state.currentEvent].budget_items;
  const plannedSum = rows.reduce((s,b)=> s + (Number(b.planned_amount)||0), 0);
  const actualSum = rows.reduce((s,b)=> s + (Number(b.actual_amount)||0), 0);
  const body = rows.length ? rows.map(r => `
    <tr>
      <td data-label="Category"><input list="budgetCatList" data-table="budget_items" data-id="${r.id}" data-field="category" value="${esc(r.category)}"></td>
      <td data-label="Item"><input data-table="budget_items" data-id="${r.id}" data-field="item_name" value="${esc(r.item_name)}"></td>
      <td data-label="Planned"><input type="number" data-table="budget_items" data-id="${r.id}" data-field="planned_amount" value="${r.planned_amount ?? 0}"></td>
      <td data-label="Actual"><input type="number" data-table="budget_items" data-id="${r.id}" data-field="actual_amount" value="${r.actual_amount ?? ''}" placeholder="0"></td>
      <td data-label="Diff" style="font-family:var(--font-mono); color:${(r.actual_amount||0) > (r.planned_amount||0) ? 'var(--danger)' : 'var(--ink-soft)'};">${AUD((r.planned_amount||0) - (r.actual_amount||0))}</td>
      <td data-label="Notes"><input data-table="budget_items" data-id="${r.id}" data-field="notes" value="${esc(r.notes||'')}"></td>
      <td data-label="" class="actions"><button class="del-btn" data-action="delete" data-table="budget_items" data-id="${r.id}">✕</button></td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="7">No budget lines yet — add your first one above.</td></tr>`;

  return `
    ${datalist('budgetCatList', BUDGET_CATS)}
    <div class="budget-summary">
      <div class="stat-card"><div class="v">${AUD(plannedSum)}</div><div class="l">Planned total</div></div>
      <div class="stat-card"><div class="v">${AUD(actualSum)}</div><div class="l">Actual so far</div></div>
      <div class="stat-card"><div class="v" style="color:${plannedSum-actualSum<0?'var(--danger)':'var(--accent)'}">${AUD(plannedSum-actualSum)}</div><div class="l">Remaining</div></div>
    </div>
    <button class="add-toggle" data-toggle="budgetForm">+ Add budget line</button>
    <form class="add-form" id="budgetForm">
      <div class="field"><label>Category</label><input list="budgetCatList" id="b_category" required></div>
      <div class="field"><label>Item</label><input id="b_item" required></div>
      <div class="field"><label>Planned (AUD)</label><input id="b_planned" type="number" required></div>
      <div class="field"><label>Actual (AUD)</label><input id="b_actual" type="number"></div>
      <div class="field full"><label>Notes</label><input id="b_notes"></div>
      <div class="submit-row">
        <button type="button" class="btn-ghost" data-toggle="budgetForm">Cancel</button>
        <button type="submit" class="btn-primary">Save line</button>
      </div>
    </form>
    <table class="data-table">
      <thead><tr><th>Category</th><th>Item</th><th>Planned</th><th>Actual</th><th>Diff</th><th>Notes</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

function renderTasks(){
  const rows = [...state.data[state.currentEvent].tasks].sort((a,b)=>{
    if (a.completed !== b.completed) return a.completed ? 1 : -1;
    return (a.due_date||'9999') < (b.due_date||'9999') ? -1 : 1;
  });
  const today = new Date().toDateString();
  const body = rows.length ? rows.map(r => {
    const overdue = r.due_date && !r.completed && new Date(r.due_date+'T00:00:00') < new Date(today);
    return `
    <tr style="${r.completed ? 'opacity:.5;' : ''}">
      <td data-label="Done" style="text-align:center;"><input type="checkbox" data-table="tasks" data-id="${r.id}" data-field="completed" ${r.completed?'checked':''}></td>
      <td data-label="Task"><input data-table="tasks" data-id="${r.id}" data-field="title" value="${esc(r.title)}"></td>
      <td data-label="Category"><input list="taskCatList" data-table="tasks" data-id="${r.id}" data-field="category" value="${esc(r.category||'')}"></td>
      <td data-label="Due"><input type="date" data-table="tasks" data-id="${r.id}" data-field="due_date" value="${r.due_date||''}" style="${overdue?'color:var(--danger); font-weight:600;':''}"></td>
      <td data-label="Notes"><input data-table="tasks" data-id="${r.id}" data-field="notes" value="${esc(r.notes||'')}"></td>
      <td data-label="" class="actions"><button class="del-btn" data-action="delete" data-table="tasks" data-id="${r.id}">✕</button></td>
    </tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="6">Nothing on the checklist yet — add your first task above.</td></tr>`;

  return `
    ${datalist('taskCatList', TASK_CATS)}
    <button class="add-toggle" data-toggle="taskForm">+ Add task</button>
    <form class="add-form" id="taskForm">
      <div class="field full"><label>Task</label><input id="t_title" required></div>
      <div class="field"><label>Category</label><input list="taskCatList" id="t_category"></div>
      <div class="field"><label>Due date</label><input id="t_due" type="date"></div>
      <div class="field full"><label>Notes</label><input id="t_notes"></div>
      <div class="submit-row">
        <button type="button" class="btn-ghost" data-toggle="taskForm">Cancel</button>
        <button type="submit" class="btn-primary">Save task</button>
      </div>
    </form>
    <table class="data-table">
      <thead><tr><th>Done</th><th>Task</th><th>Category</th><th>Due</th><th>Notes</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

function renderGuests(){
  const rows = state.data[state.currentEvent].guests;
  const body = rows.length ? rows.map(r => `
    <tr>
      <td data-label="Name"><input data-table="guests" data-id="${r.id}" data-field="name" value="${esc(r.name)}"></td>
      <td data-label="Side"><input list="guestSideList" data-table="guests" data-id="${r.id}" data-field="side" value="${esc(r.side||'')}"></td>
      <td data-label="RSVP">
        <select data-table="guests" data-id="${r.id}" data-field="rsvp_status" class="badge ${r.rsvp_status}">${
          Object.entries(RSVP_LABELS).map(([v,l])=>`<option value="${v}" ${v===r.rsvp_status?'selected':''}>${l}</option>`).join('')
        }</select>
      </td>
      <td data-label="Plus one" style="text-align:center;"><input type="checkbox" data-table="guests" data-id="${r.id}" data-field="plus_one" ${r.plus_one?'checked':''}></td>
      <td data-label="Dietary"><input data-table="guests" data-id="${r.id}" data-field="dietary_notes" value="${esc(r.dietary_notes||'')}"></td>
      <td data-label="" class="actions"><button class="del-btn" data-action="delete" data-table="guests" data-id="${r.id}">✕</button></td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="6">No guests yet — add your first one above.</td></tr>`;

  const headcount = rows.filter(r=>r.rsvp_status==='yes').length + rows.filter(r=>r.rsvp_status==='yes' && r.plus_one).length;

  return `
    ${datalist('guestSideList', GUEST_SIDES)}
    <div class="budget-summary">
      <div class="stat-card"><div class="v">${rows.length}</div><div class="l">On the list</div></div>
      <div class="stat-card"><div class="v">${rows.filter(r=>r.rsvp_status==='yes').length}</div><div class="l">Confirmed yes</div></div>
      <div class="stat-card"><div class="v">${rows.filter(r=>r.rsvp_status==='pending').length}</div><div class="l">Pending</div></div>
      <div class="stat-card"><div class="v">${headcount}</div><div class="l">Headcount incl. +1s</div></div>
    </div>
    <button class="add-toggle" data-toggle="guestForm">+ Add guest</button>
    <form class="add-form" id="guestForm">
      <div class="field"><label>Name</label><input id="g_name" required></div>
      <div class="field"><label>Side</label><input list="guestSideList" id="g_side"></div>
      <div class="field"><label>RSVP</label><select id="g_rsvp"><option value="pending">Pending</option><option value="yes">Yes</option><option value="no">No</option></select></div>
      <div class="field full"><label>Dietary / notes</label><input id="g_notes"></div>
      <div class="submit-row">
        <button type="button" class="btn-ghost" data-toggle="guestForm">Cancel</button>
        <button type="submit" class="btn-primary">Save guest</button>
      </div>
    </form>
    <table class="data-table">
      <thead><tr><th>Name</th><th>Side</th><th>RSVP</th><th>Plus one</th><th>Dietary / notes</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

function esc(s){ return String(s ?? '').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ---------------- events / delegation ---------------- */
document.getElementById('eventTabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-event]');
  if (!btn || btn.classList.contains('active')) return;
  const target = btn.dataset.event;
  const rect = btn.getBoundingClientRect();
  document.querySelectorAll('#eventTabs .portal-btn').forEach(b => b.classList.toggle('active', b === btn));
  portalSwitch(rect.left + rect.width / 2, rect.top + rect.height / 2, target, () => {
    state.currentEvent = target;
    document.body.dataset.theme = target;
    renderSummary();
    renderSection();
  });
});

document.getElementById('sectionTabs').addEventListener('click', e => {
  const btn = e.target.closest('[data-section]');
  if (!btn) return;
  state.currentSection = btn.dataset.section;
  document.querySelectorAll('#sectionTabs button[data-section]').forEach(b => b.classList.toggle('active', b === btn));
  moveTabIndicator(btn);
  renderSection();
});

function moveTabIndicator(btn){
  const indicator = document.getElementById('tabIndicator');
  if (!btn || !indicator) return;
  indicator.style.left = btn.offsetLeft + 'px';
  indicator.style.width = btn.offsetWidth + 'px';
}

document.getElementById('sectionContent').addEventListener('click', e => {
  const toggle = e.target.closest('[data-toggle]');
  if (toggle){
    const form = document.getElementById(toggle.dataset.toggle);
    form.classList.toggle('open');
    return;
  }
  const del = e.target.closest('[data-action="delete"]');
  if (del){
    if (confirm('Delete this row?')) deleteRow(del.dataset.table, del.dataset.id);
  }
});

document.getElementById('sectionContent').addEventListener('change', e => {
  const el = e.target.closest('[data-field]');
  if (!el) return;
  const table = el.dataset.table, id = el.dataset.id, field = el.dataset.field;
  let value;
  if (el.type === 'checkbox') value = el.checked;
  else if (el.type === 'number') value = el.value === '' ? null : Number(el.value);
  else value = el.value;
  updateRow(table, id, { [field]: value });
  if (el.type === 'checkbox' && el.checked && ['deposit_paid','completed','plus_one'].includes(field)){
    const rect = el.getBoundingClientRect();
    burstSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    playChime('sparkle');
  }
  if (el.tagName === 'SELECT') el.className = 'badge ' + value;
  if (el.tagName === 'SELECT' && field === 'rsvp_status' && value === 'yes'){
    const rect = el.getBoundingClientRect();
    burstSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2);
    playChime('sparkle');
  }
  if (['status','deposit_paid','completed','rsvp_status','plus_one','actual_amount','planned_amount'].includes(field)){
    renderSummary();
    if (['status','deposit_paid'].includes(field)) return;
    renderSection();
  }
});

document.getElementById('sectionContent').addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'vendorForm'){
    insertRow('vendors', {
      category: document.getElementById('v_category').value,
      name: document.getElementById('v_name').value,
      contact_phone: document.getElementById('v_contact').value,
      status: document.getElementById('v_status').value,
      price: document.getElementById('v_price').value ? Number(document.getElementById('v_price').value) : null,
      deposit_amount: document.getElementById('v_deposit').value ? Number(document.getElementById('v_deposit').value) : null,
      notes: document.getElementById('v_notes').value
    });
    e.target.reset(); e.target.classList.remove('open');
  } else if (e.target.id === 'budgetForm'){
    insertRow('budget_items', {
      category: document.getElementById('b_category').value,
      item_name: document.getElementById('b_item').value,
      planned_amount: Number(document.getElementById('b_planned').value || 0),
      actual_amount: document.getElementById('b_actual').value ? Number(document.getElementById('b_actual').value) : null,
      notes: document.getElementById('b_notes').value
    });
    e.target.reset(); e.target.classList.remove('open');
  } else if (e.target.id === 'taskForm'){
    insertRow('tasks', {
      title: document.getElementById('t_title').value,
      category: document.getElementById('t_category').value,
      due_date: document.getElementById('t_due').value || null,
      notes: document.getElementById('t_notes').value
    });
    e.target.reset(); e.target.classList.remove('open');
  } else if (e.target.id === 'guestForm'){
    insertRow('guests', {
      name: document.getElementById('g_name').value,
      side: document.getElementById('g_side').value,
      rsvp_status: document.getElementById('g_rsvp').value,
      notes: document.getElementById('g_notes').value
    });
    e.target.reset(); e.target.classList.remove('open');
  }
});

document.getElementById('eventDateInput').addEventListener('change', e => updateEventDate(e.target.value));

/* ---------------- parallax ---------------- */
if (window.matchMedia('(hover: hover)').matches){
  window.addEventListener('mousemove', e => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;
    document.querySelectorAll('.sunRays, .roseWindow').forEach(el => {
      el.style.transform = `translate(${x*10}px, ${y*10}px)`;
    });
    document.querySelectorAll('.sunGlow, .moonGlow').forEach(el => {
      el.style.transform = `translate(${x*-14}px, ${y*-14}px)`;
    });
  });
}

/* ---------------- pin preview toggle ---------------- */
document.getElementById('pinPreviewToggle').addEventListener('click', e => {
  const btn = e.target.closest('[data-preview]');
  if (!btn) return;
  document.querySelectorAll('#pinPreviewToggle button').forEach(b => b.classList.toggle('active', b === btn));
  document.body.dataset.theme = btn.dataset.preview;
});

/* ---------------- init ---------------- */
async function init(){
  const { data: evRows, error } = await supabaseClient.from('events').select('*');
  if (error){
    document.getElementById('sectionContent').innerHTML = `<p style="color:var(--danger); padding:20px;">Couldn't connect to Supabase — check config.js has your real URL and anon key, and that you ran schema.sql. (${error.message})</p>`;
    return;
  }
  evRows.forEach(r => state.events[r.id] = r);

  for (const ev of ['wedding','homecoming']){
    const [vendors, budget_items, tasks, guests] = await Promise.all([
      fetchTable('vendors', ev), fetchTable('budget_items', ev), fetchTable('tasks', ev), fetchTable('guests', ev)
    ]);
    state.data[ev] = { vendors, budget_items, tasks, guests };
  }
  renderSummary();
  renderSection();
  moveTabIndicator(document.querySelector('#sectionTabs button.active'));
}

const UNLOCK_KEY = 'wedplanner_unlocked';

function unlock(){
  localStorage.setItem(UNLOCK_KEY, '1');
  document.body.classList.add('unlocked');
  playChime('unlock');
  init();
}

document.getElementById('pinForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('pinInput');
  const card = document.querySelector('.pin-card');
  if (input.value.trim() === String(APP_PIN)){
    state.currentEvent = document.body.dataset.theme || 'wedding';
    document.querySelectorAll('#eventTabs .portal-btn').forEach(b => b.classList.toggle('active', b.dataset.event === state.currentEvent));
    unlock();
  } else {
    document.getElementById('pinError').textContent = 'Wrong PIN — try again.';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    input.value = '';
    input.focus();
  }
});

document.getElementById('lockBtn').addEventListener('click', () => {
  localStorage.removeItem(UNLOCK_KEY);
  document.body.classList.remove('unlocked');
  document.getElementById('pinInput').value = '';
  document.getElementById('pinInput').focus();
});

window.addEventListener('resize', () => moveTabIndicator(document.querySelector('#sectionTabs button.active')));

if (localStorage.getItem(UNLOCK_KEY) === '1'){
  document.body.classList.add('unlocked');
  init();
}
</script>
</body>
</html>
